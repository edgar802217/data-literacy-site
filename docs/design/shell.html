<title>全站骨架原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：首頁的雙欄就是全站骨架。左欄「舞台」（標題＋數字海）換頁時留在原地、只收窄與換字；右欄是各頁內容。 */
:root {
  --bg: #FFFFFF; --paper: #F5F8FA; --line: #DCE4EA;
  --ink: #1B2833; --soft: #64717D; --sea: #7D8C99;
  --act: #1B5FA6; --act-dk: #154C86; --on-act: #FFFFFF; --ok: #1F7A4D; --bad: #B42318;
  --lv-a: #2185B5; --lv-a-tx: #17698F; --lv-a-wash: #E6F2F8;
  --lv-b: #1E97A3; --lv-b-tx: #0E6E7A; --lv-b-wash: #E4F4F5;
  --lv-t: #EE7A1D; --lv-t-tx: #A9520B; --lv-t-wash: #FDF0E4;
  --head: "Chiron GoRound TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --sans: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2, 0, 0, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161D; --paper: #17202A; --line: #2B3844; --ink: #E5EBF0; --soft: #9AA8B5; --sea: #6F8090;
    --act: #3D82CC; --act-dk: #5B97D8; --ok: #6CCB95; --bad: #F08A80;
    --lv-a: #58B2DD; --lv-a-tx: #7CC4E6; --lv-a-wash: #152836; --lv-b: #45BCC6; --lv-b-tx: #6FCFD6; --lv-b-wash: #122C2F;
    --lv-t: #F29A55; --lv-t-tx: #F5AE75; --lv-t-wash: #302217; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10161D; --paper: #17202A; --line: #2B3844; --ink: #E5EBF0; --soft: #9AA8B5; --sea: #6F8090;
  --act: #3D82CC; --act-dk: #5B97D8; --ok: #6CCB95; --bad: #F08A80;
  --lv-a: #58B2DD; --lv-a-tx: #7CC4E6; --lv-a-wash: #152836; --lv-b: #45BCC6; --lv-b-tx: #6FCFD6; --lv-b-wash: #122C2F;
  --lv-t: #F29A55; --lv-t-tx: #F5AE75; --lv-t-wash: #302217; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--act); outline-offset: 3px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1320px; margin-inline: auto; padding-inline: 48px; }

/* 頁首 */
.head-in { min-height: 84px; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 14px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand img { width: 50px; display: block; }
.brand span { font: 700 20px/1.3 var(--head); letter-spacing: .04em; }
.nav { display: flex; align-items: center; gap: 32px; }
.nav button { background: none; border: 0; padding: 8px 0; cursor: pointer; font-weight: 500; position: relative; }
.nav button::after { content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 2px; background: var(--act); transform: scaleX(0); transform-origin: left; transition: transform 200ms var(--ease); }
.nav button[aria-current="page"]::after, .nav button:hover::after { transform: scaleX(1); }
.nav .login { color: var(--act); padding-left: 28px; border-left: 1px solid var(--line); }

/* 骨架：舞台＋內容 */
.shell { display: flex; align-items: flex-start; gap: 48px; padding-block: 52px 96px; }
.stage { flex: 0 0 calc(46% - 24px); min-width: 0; transition: flex-basis 520ms var(--ease); }
.pane { flex: 1 1 0; min-width: 0; }
.shell:not([data-page="home"]) .stage { flex-basis: calc(31% - 24px); position: sticky; top: 24px; }
html.vt .stage { transition: none; }
.stage-text { view-transition-name: stage-text; }
.sea-box { view-transition-name: sea; position: relative; aspect-ratio: 5 / 3; max-width: 100%; background: var(--paper); overflow: hidden; cursor: crosshair; touch-action: pan-y; }
.sea-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sea-fig { margin: 32px 0 0; }
.sea-fig figcaption { margin-top: 8px; font-size: 13px; color: var(--soft); }
.eyebrow { margin: 0; font-size: 14px; letter-spacing: .12em; color: var(--soft); }
.stage h1 { margin: 14px 0 18px; font: 700 clamp(38px, 3.8vw, 52px)/1.38 var(--head); text-wrap: balance; }
.shell:not([data-page="home"]) .stage h1 { font-size: clamp(28px, 2.4vw, 34px); margin: 8px 0 12px; }
.stage h1:focus { outline: none; }
.stage .lead { margin: 0; font-size: 17px; max-width: 30em; }
.shell:not([data-page="home"]) .stage .lead { font-size: 15px; color: var(--soft); }
.bigdate { display: block; font: 700 clamp(44px, 4.2vw, 60px)/1.1 var(--head); font-variant-numeric: tabular-nums; }
.bigdate + small { display: block; font: 400 14px var(--mono); color: var(--soft); margin-top: 6px; }
.home-link { display: inline-block; margin-top: 14px; font-size: 14px; color: var(--soft); background: none; border: 0; padding: 6px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 5px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px; margin-top: 28px; }
.btn { display: inline-flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 28px; background: var(--act); color: var(--on-act); border: 0; border-radius: 8px; font-weight: 700; letter-spacing: .06em; cursor: pointer; text-decoration: none; transition: background-color 140ms var(--ease); }
.btn:hover { background: var(--act-dk); }
.tlink { background: none; border: 0; padding: 10px 0; font-weight: 700; text-decoration: underline; text-underline-offset: 7px; cursor: pointer; }
.arr { display: inline-block; transition: transform 140ms var(--ease); }
button:hover > .arr, a:hover > .arr { transform: translateX(2px); }

/* 研習列（首頁與研習頁共用） */
.th { display: flex; align-items: center; gap: 24px; }
.th h2 { margin: 0; font: 700 20px/1.5 var(--head); letter-spacing: .12em; }
.rule { flex: 1; height: 1px; background: var(--line); }
.range { font: 400 14px var(--mono); }
.list { margin-top: 18px; }
.row { --c: var(--act); --ct: var(--act); --cw: var(--paper); position: relative; border-bottom: 1px solid var(--line); transition: background-color 140ms var(--ease), box-shadow 140ms var(--ease); }
.row[data-c="A"] { --c: var(--lv-a); --ct: var(--lv-a-tx); --cw: var(--lv-a-wash); }
.row[data-c="B"] { --c: var(--lv-b); --ct: var(--lv-b-tx); --cw: var(--lv-b-wash); }
.row[data-c="T"] { --c: var(--lv-t); --ct: var(--lv-t-tx); --cw: var(--lv-t-wash); }
.row:hover { background: var(--paper); }
.row.linked:not(.open) { background: var(--cw); }
.row.open { background: var(--cw); box-shadow: inset 3px 0 0 var(--c); }
.rhead { position: relative; display: grid; grid-template-columns: 92px minmax(0, 1fr) auto 28px; column-gap: 24px; align-items: start; padding: 22px 16px 22px 20px; }
.date time { display: block; color: var(--ct); font: 700 28px/1.25 var(--head); font-variant-numeric: tabular-nums; }
.date small { display: block; font: 400 13px var(--mono); color: var(--soft); margin-top: 4px; }
.main { border-left: 1px solid var(--line); padding-left: 24px; min-width: 0; }
.kind { margin: 0; font-size: 13px; font-weight: 700; color: var(--ct); letter-spacing: .08em; }
.main h3 { margin: 2px 0 4px; font: 700 21px/1.5 var(--head); }
.main h3 button { all: unset; cursor: pointer; text-wrap: balance; }
.main h3 button::after { content: ""; position: absolute; inset: 0; }
.main h3 button:focus-visible { outline: 3px solid var(--act); outline-offset: 3px; }
.meta { margin: 0; font-size: 15px; color: var(--soft); }
.state { align-self: center; font-size: 15px; font-weight: 700; white-space: nowrap; }
.state.good { color: var(--ok); }
.sign { align-self: center; justify-self: end; font: 300 24px/1 var(--sans); }
.sign.plus::before { content: "+"; } .open .sign.plus::before { content: "−"; }
.sign.go::before { content: "→"; font-size: 20px; }
.panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 220ms var(--ease); }
.open > .panel { grid-template-rows: 1fr; }
.pwrap { overflow: hidden; min-height: 0; }
.pin { margin: 0 16px 0 161px; padding: 14px 0 22px; border-top: 1px solid color-mix(in srgb, var(--c) 35%, transparent); display: grid; gap: 10px; }
.pin p { margin: 0; }
.go-link { justify-self: start; background: none; border: 0; padding: 6px 0; font-weight: 700; text-decoration: underline; text-underline-offset: 7px; cursor: pointer; }
.all { display: flex; justify-content: flex-end; margin-top: 16px; }
.all button { background: none; border: 0; color: var(--act); font-weight: 700; text-decoration: underline; text-underline-offset: 7px; padding: 8px 0; cursor: pointer; }

/* 研習頁 */
.tabs { display: flex; flex-wrap: wrap; gap: 4px 28px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 10px 0 12px; cursor: pointer; color: var(--soft); font-weight: 500; position: relative; }
.tabs button[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tabs button[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 8px; }
.chip { min-height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.month { display: flex; align-items: center; gap: 16px; margin: 26px 0 0; font: 700 15px/1.4 var(--head); color: var(--soft); }
.month::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.note { font-size: 13px; color: var(--soft); margin: 14px 0 0; }

/* 場次詳情 */
.back { background: none; border: 0; padding: 6px 0; color: var(--soft); cursor: pointer; text-decoration: underline; text-underline-offset: 5px; }
.dhead { --c: var(--act); --ct: var(--act); margin-top: 18px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.dhead[data-c="A"] { --ct: var(--lv-a-tx); } .dhead[data-c="B"] { --ct: var(--lv-b-tx); } .dhead[data-c="T"] { --ct: var(--lv-t-tx); }
.dhead .kind { color: var(--ct); }
.dhead h2 { margin: 4px 0 6px; font: 700 clamp(26px, 2.4vw, 32px)/1.4 var(--head); }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 22px 0 0; }
.facts div { border-top: 2px solid var(--line); padding-top: 10px; }
.facts dt { font-size: 13px; color: var(--soft); }
.facts dd { margin: 2px 0 0; font-weight: 700; }
.judge { --c: var(--act); margin-top: 26px; padding: 18px 20px; background: var(--paper); display: grid; gap: 8px; }
.judge[data-c="A"] { --c: var(--lv-a); } .judge[data-c="B"] { --c: var(--lv-b); } .judge[data-c="T"] { --c: var(--lv-t); }
.who { margin: 0; font-size: 13px; color: var(--soft); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.checks li { display: flex; gap: 10px; align-items: baseline; opacity: 0; transform: translateX(-4px); transition: opacity 240ms var(--ease) calc(var(--i) * 150ms + 250ms), transform 240ms var(--ease) calc(var(--i) * 150ms + 250ms); }
.run .checks li { opacity: 1; transform: none; }
.run .checks li[data-ok="-"] { opacity: .55; }
.mk { width: 16px; flex: none; font-weight: 700; text-align: center; }
li[data-ok="1"] .mk::before { content: "✓"; color: var(--ok); }
li[data-ok="0"] .mk::before { content: "✕"; color: var(--bad); }
li[data-ok="-"] .mk::before { content: "–"; color: var(--soft); }
.verdict { margin: 0; font-weight: 700; opacity: 0; transition: opacity 300ms var(--ease) calc(var(--n) * 150ms + 350ms); }
.run .verdict { opacity: 1; }
.verdict.ok { color: var(--ok); }
.meters { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 14px; align-items: center; font-size: 14px; color: var(--soft); margin-top: 6px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 3px; transition: width 650ms var(--ease) 400ms; }
.run .bar i { width: calc(var(--v) * 100%); }
.ticks { display: flex; gap: 2px; height: 12px; }
.ticks i { flex: 1; background: var(--line); transition: background-color 200ms var(--ease) calc(var(--k) * 22ms + 420ms); }
.run .ticks i.on { background: var(--c); }
.mv { font: 500 13px var(--mono); color: var(--ink); white-space: nowrap; }
.cta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 22px; }
.body h3 { font: 700 18px/1.5 var(--head); margin: 30px 0 8px; }
.body ul { margin: 0; padding-left: 1.2em; }

/* 關於計畫 */
.figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; border-top: 1px solid var(--line); margin-top: 8px; }
.figs button { all: unset; display: block; padding: 18px 0 14px; border-bottom: 1px solid var(--line); cursor: default; }
.figs button:focus-visible { outline: 3px solid var(--act); outline-offset: 2px; }
.figs b { display: block; font: 700 40px/1.2 var(--head); }
.figs span { font-size: 14px; color: var(--soft); }
.pane p.text { max-width: 38em; }

/* 原型說明列 */
.demo { position: fixed; z-index: 60; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 10px 16px; background: var(--ink); color: var(--bg); border-radius: 8px; font-size: 13.5px; max-width: calc(100vw - 32px); text-align: center; }
.toast { position: fixed; z-index: 61; left: 50%; top: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; }

/* 換頁轉場 */
::view-transition-group(*) { animation-duration: 460ms; animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
::view-transition-old(root) { animation: 180ms var(--ease) both vt-out; }
::view-transition-new(root) { animation: 320ms var(--ease) 120ms both vt-in; }
::view-transition-old(stage-text) { animation: 160ms var(--ease) both vt-out; }
::view-transition-new(stage-text) { animation: 300ms var(--ease) 140ms both vt-in; }
@keyframes vt-out { to { opacity: 0; } }
@keyframes vt-in { from { opacity: 0; transform: translateY(8px); } }

@media (max-width: 1199px) { .wrap { padding-inline: 32px; } .shell { gap: 32px; } }
@media (max-width: 1023px) {
  .shell { flex-direction: column; gap: 32px; }
  .stage, .shell:not([data-page="home"]) .stage { flex-basis: auto; width: 100%; position: static; }
  .shell:not([data-page="home"]) .sea-box { aspect-ratio: 5 / 1.3; }
  .shell:not([data-page="home"]) .sea-fig { margin-top: 18px; }
  .shell:not([data-page="home"]) .sea-fig figcaption { display: none; }
  .nav { gap: 20px; }
}
@media (max-width: 767px) {
  .wrap { padding-inline: 20px; }
  .head-in { flex-wrap: wrap; min-height: 0; padding-block: 12px; row-gap: 6px; }
  .brand img { width: 40px; } .brand span { font-size: 17px; }
  .nav { width: 100%; gap: 18px; overflow-x: auto; }
  .nav .login { padding-left: 18px; }
  .shell { padding-block: 28px 96px; }
  .stage h1 { font-size: 34px; }
  .rhead { grid-template-columns: 64px minmax(0, 1fr) 22px; column-gap: 14px; padding: 18px 10px 18px 12px; }
  .rhead .state { grid-column: 2; grid-row: 2; justify-self: start; margin-top: 6px; padding-left: 15px; }
  .rhead .sign { grid-column: 3; grid-row: 1; align-self: start; padding-top: 4px; }
  .date time { font-size: 22px; }
  .main { padding-left: 14px; }
  .main h3 { font-size: 19px; }
  .pin { margin: 0 12px; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .stage, .row, .panel, .btn, .arr, .checks li, .verdict, .bar i, .ticks i, .nav button::after { transition: none; }
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}
</style>

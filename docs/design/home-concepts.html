<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>首頁三種方向</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
</head>
<body>
<style>
/* 首頁三種方向的比較原型。三個方向共用同一份內容與「分岔口」流程，只換視覺語言：
   A 長條就是介面（明亮、LOGO 長條當骨架）、B 數據編輯風（深色、超大字、方格紙）、C 色塊拼貼（明亮、大色塊與幾何形狀）。
   版面：上方工具列、中間瀏覽器框（container query 依框寬切手機版）、右側說明。 */
:root{
  color-scheme:light;
  --tool:#17222B; --tool-2:#26343F; --tool-tx:#E9EEF2; --canvas:#E4E9ED;
  --blue:#1B5FA6; --sky:#2185B5; --teal:#1E97A3; --orange:#EE7A1D;
  --ink:#1B2833; --ink-2:#3E4C58; --soft:#64717D; --line:#DCE4EA; --paper:#F5F8FA; --bg:#FFFFFF;
  --f-head:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--canvas)}
body{margin:0;color:var(--ink);font:16px/1.7 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #4C8BD6;outline-offset:3px;border-radius:6px}

/* ---------- 工具列與外框 ---------- */
.tool{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--tool);color:var(--tool-tx)}
.tool .in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;max-width:1560px;margin:auto}
.tool h1{font:800 1rem/1.2 var(--f-head);margin:0;white-space:nowrap}
.tool h1 small{font:500 .75rem var(--f-body);color:#9FB0BF;margin-left:6px}
.seg{display:inline-flex;background:var(--tool-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;color:#C4D0DA;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:.86rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:700}
.tool .grp{display:flex;align-items:center;gap:8px}
.tool .lb{font-size:.75rem;color:#9FB0BF;letter-spacing:.06em}
.tool .sp{flex:1}
.tbtn{background:none;border:1px solid #4A5A68;color:var(--tool-tx);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:.86rem;white-space:nowrap}
.tbtn:hover{background:var(--tool-2)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;max-width:1560px;margin:auto;padding:24px 16px 64px;align-items:start}
.work.nonotes{grid-template-columns:minmax(0,1fr)}
@media (max-width:1100px){.work{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;justify-content:center;min-width:0}
.browser{width:100%;max-width:1200px;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -36px rgba(23,34,43,.6);background:#fff}
.browser.phone{max-width:390px;border-radius:30px;border:9px solid #17222B}
.chrome{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;background:#EEF2F5;border-bottom:1px solid #DDE4EA;font-size:.74rem;color:#8C98A3}
.chrome i{width:9px;height:9px;border-radius:50%;background:#D4DBE1}
.chrome span{margin-left:8px}
.phone .chrome{justify-content:center}.phone .chrome i{display:none}
.frame{container-type:inline-size;position:relative;overflow:hidden}
.notes{position:sticky;top:76px;background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 0 #D4DBE1;font-size:.9rem;line-height:1.65}
.notes h2{font:800 1.1rem/1.3 var(--f-head);margin:0}
.notes .tag{display:inline-block;font:700 .72rem/1 var(--f-body);letter-spacing:.06em;color:#fff;background:var(--c);padding:4px 8px;border-radius:5px;margin-bottom:8px}
.notes h3{font-size:.8rem;letter-spacing:.06em;color:var(--soft);margin:14px 0 4px}
.notes ul{margin:0;padding-left:1.1em}
.notes li+li{margin-top:4px}
.notes .tip{margin-top:14px;padding:10px 12px;background:var(--paper);border-radius:10px}
@media (max-width:1100px){.notes{position:static}}

/* ---------- 共用：產品內元素 ---------- */
.p{position:relative}
.p h1,.p h2,.p h3,.p h4{margin:0;font-family:var(--f-head);font-weight:800;line-height:1.2;text-wrap:balance}
.p p{margin:0}
.p .wrap{max-width:1100px;margin:auto;padding-inline:40px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar{display:flex;align-items:center;gap:14px;height:68px}
.topbar .logo{display:flex;align-items:center;gap:10px;font:800 1rem/1.2 var(--f-head);background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit}
.topbar .logo svg{width:34px;height:30px;flex:none}
.topbar nav{display:flex;gap:4px;margin-left:auto}
.topbar nav button{background:none;border:0;padding:8px 12px;border-radius:999px;cursor:pointer;color:inherit;opacity:.8;font-size:.95rem}
.topbar nav button:hover{opacity:1}
.topbar .login{border:2px solid currentColor;border-radius:999px;padding:7px 16px;font-weight:700;background:none;cursor:pointer;color:inherit;font-size:.92rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;font-weight:700;font-size:1rem;border:2px solid transparent;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn .ic{width:16px;height:16px}
.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:#1B2833;color:#fff;padding:11px 16px;border-radius:12px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 迷你試玩（三個方向共用骨架，配色各自覆寫） */
.try{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;align-items:stretch}
.try .ctrl{display:flex;flex-direction:column;gap:12px}
.try .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.try .steps li{display:flex;gap:10px;align-items:center;font-size:.95rem;opacity:.5}
.try .steps li.on{opacity:1;font-weight:700}
.try .steps li b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;border:2px solid currentColor;flex:none}
.try .steps li.done b{background:currentColor}
.try .steps li.done b span{color:var(--try-bg,#fff)}
.try .screen{border-radius:16px;padding:16px;min-height:240px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.try .chipfile{display:inline-flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;cursor:grab;font-weight:700;border:2px solid currentColor;background:none;color:inherit}
.try .drop{flex:1;border:2px dashed currentColor;border-radius:14px;display:grid;place-items:center;text-align:center;opacity:.75;padding:16px;cursor:pointer;background:none;color:inherit;min-height:150px}
.try .drop.over{opacity:1;background:rgba(255,255,255,.12)}
.try table{width:100%;border-collapse:collapse;font-size:.88rem}
.try td,.try th{padding:6px 8px;text-align:left;border-bottom:1px solid rgba(127,127,127,.25)}
.try .masked{animation:flipin .5s ease-out both}
.try .bars{display:flex;align-items:flex-end;gap:14px;height:140px;padding:0 4px;border-bottom:2px solid currentColor}
.try .bars div{flex:1;border-radius:8px 8px 0 0;position:relative;transform-origin:bottom;animation:growy .8s cubic-bezier(.2,.8,.2,1) both}
.try .bars div span{position:absolute;left:0;right:0;top:-22px;text-align:center;font:700 .8rem var(--f-mono)}
.try .bars div i{position:absolute;left:0;right:0;bottom:-24px;text-align:center;font-style:normal;font-size:.78rem;opacity:.8}
.try .ainote{margin-top:22px;border-radius:12px;padding:12px 14px;font-size:.92rem;animation:reveal 1.4s steps(28) .7s both}
.try .ainote b{display:block;font-size:.74rem;letter-spacing:.06em;margin-bottom:2px}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes flipin{from{transform:rotateX(90deg);opacity:.2}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@keyframes ticker{to{transform:translateX(-50%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-8px)}}

/* 地圖 */
.tmap{width:100%;height:auto;display:block;overflow:visible}
.tmap .cty{stroke-width:1.1}
.tmap .mk{cursor:pointer}
.tmap .mk circle.ring{transform-box:fill-box;transform-origin:center;animation:breathe 2.4s ease-in-out infinite}
.tmap .mk text{font:800 15px var(--f-head);paint-order:stroke;stroke-width:5px;stroke-linejoin:round}
@keyframes breathe{50%{transform:scale(1.35);opacity:.25}}

/* =========================================================
   A：長條就是介面（明亮）
   ========================================================= */
.cA{background:#fff;color:var(--ink)}
.cA .topbar{color:var(--ink)}
.cA .hero{padding:28px 0 0;background:linear-gradient(180deg,#F2F8FA,#fff 70%)}
.cA .eyebrow{font-size:.95rem;color:var(--soft);display:flex;align-items:center;gap:10px}
.cA .eyebrow::before{content:"";width:28px;height:3px;background:var(--orange);border-radius:2px}
.cA .q{font-size:clamp(2.6rem,1.4rem + 5vw,5.2rem);letter-spacing:.01em;margin-top:10px}
.cA .q em{font-style:normal;background:linear-gradient(transparent 62%,#FBD9BC 62%)}
.cA .sub{font-size:1.1rem;color:var(--ink-2);margin-top:10px;max-width:34em}
.cA .fork{position:relative;display:flex;align-items:flex-end;gap:18px;height:420px;margin-top:28px;padding-bottom:0;border-bottom:3px solid var(--ink)}
.cA .fork svg.lineover{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.cA .bar{position:relative;border:0;border-radius:18px 18px 0 0;color:#fff;cursor:pointer;text-align:left;padding:22px 22px 20px;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;transition:height .55s cubic-bezier(.2,.8,.2,1),flex-grow .6s cubic-bezier(.2,.8,.2,1),opacity .35s,filter .3s;overflow:hidden;min-width:0}
.cA .bar.big{flex:1 1 0;height:var(--h)}
.cA .bar.small{flex:0 0 150px;height:var(--h);padding:16px}
.cA .bar .k{font:600 .8rem var(--f-mono);letter-spacing:.08em;opacity:.85}
.cA .bar h2{font-size:clamp(1.6rem,1rem + 2vw,2.5rem)}
.cA .bar.small h2{font-size:1.1rem}
.cA .bar p{font-size:.98rem;opacity:.92}
.cA .bar .go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:1rem}
.cA .bar .go .ic{transition:transform .3s}
.cA .bar:hover .go .ic,.cA .bar:focus-visible .go .ic{transform:translateX(6px)}
.cA .bar.train{background:var(--blue);--h:340px}
.cA .bar.data{background:var(--orange);--h:390px}
.cA .bar.about{background:var(--sky);--h:170px}
.cA .bar.staff{background:var(--teal);--h:120px}
.cA .fork:hover .bar.big:not(:hover){--h:290px;filter:saturate(.75)}
.cA .fork .bar.big:hover{--h:410px}
.cA .bar .deco{position:absolute;right:-20px;bottom:-20px;width:160px;height:160px;opacity:.16}
.cA.chose .fork{height:auto;border-bottom:0;gap:0}
.cA.chose .fork .bar{height:0;padding:0;flex:0 0 0;opacity:0}
.cA.chose .fork .bar.sel{flex:1 1 100%;height:150px;padding:24px 28px;opacity:1;border-radius:18px;justify-content:center}
.cA.chose .fork .bar.sel .go,.cA.chose .fork .bar.sel p{display:none}
.cA.chose .fork svg.lineover{display:none}
.cA .back{position:absolute;right:24px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.7);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.cA .path{animation:rise .6s cubic-bezier(.2,.8,.2,1) .25s both;padding:32px 0 56px}
.cA .path h3{font-size:1.5rem}
.cA .path .lead{color:var(--ink-2);margin-top:6px}
.cA .cols{display:grid;grid-template-columns:.9fr 1.1fr;gap:36px;margin-top:22px;align-items:start}
.cA .maparea{background:#F2F8FA;border-radius:20px;padding:18px}
.cA .tmap .cty{fill:#D6EAF0;stroke:#fff}
.cA .tmap .mk circle.dot{fill:var(--blue);stroke:#fff;stroke-width:3}
.cA .tmap .mk circle.ring{fill:var(--blue);opacity:.18}
.cA .tmap .mk.on circle.dot{fill:var(--orange)}
.cA .tmap .mk text{fill:var(--ink);stroke:#F2F8FA}
.cA .slist{display:flex;flex-direction:column;gap:10px}
.cA .sc{display:grid;grid-template-columns:74px 1fr auto;gap:4px 16px;align-items:center;padding:14px 16px;border-radius:16px;background:#fff;border:2px solid var(--line);animation:rise .45s both}
.cA .sc .d{font:800 1.35rem/1 var(--f-head);text-align:center}
.cA .sc .d small{display:block;font:500 .75rem var(--f-body);color:var(--soft);margin-top:4px}
.cA .sc h4{font-size:1.05rem}
.cA .sc .m{font-size:.85rem;color:var(--soft)}
.cA .lvl{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700}
.cA .lvl::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.cA .sc .cta{font-weight:700;color:var(--blue);white-space:nowrap}
.cA .stairs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:36px;align-items:end}
.cA .stair{border-radius:16px 16px 0 0;padding:16px;color:#fff;display:flex;flex-direction:column;gap:4px;min-height:var(--sh)}
.cA .stair b{font:800 1.15rem var(--f-head)}
.cA .stair span{font-size:.88rem;opacity:.92}
.cA .stairs-note{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center;margin-top:14px;font-size:.95rem;color:var(--ink-2)}
.cA .stairs-note .tt{padding:10px 14px;border-radius:12px;background:#FDF0E4;color:#7A3E06}
.cA .btn.p{background:var(--blue);color:#fff}
.cA .btn.o{background:var(--orange);color:#fff}
.cA .btn.s{background:#fff;color:var(--ink);border-color:var(--ink)}
.cA .try .screen{background:#FFF5EC;color:#7A3E06;--try-bg:#FFF5EC}
.cA .try .steps li{color:#7A3E06}
.cA .try .bars div{background:var(--orange)}
.cA .try .bars div.hi{background:var(--blue)}
.cA .try .ainote{background:#fff;border:2px solid var(--orange);color:var(--ink)}
.cA .try .ainote b{color:#B45309}
.cA .after{background:var(--paper);padding:44px 0}
.cA .after .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:3px solid var(--ink)}
.cA .after .grid div{padding:18px 16px 0 0}
.cA .after b{display:block;font:800 2.6rem/1 var(--f-head);color:var(--c)}
.cA .after span{color:var(--soft);font-size:.9rem}
.cA .news{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:32px}
.cA .news a{display:block;padding:16px;background:#fff;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:700;border-bottom:4px solid var(--c)}
.cA .news a small{display:block;font:600 .78rem var(--f-mono);color:var(--soft);margin-bottom:6px}
@container (max-width:760px){
  .cA .wrap{padding-inline:18px}
  .cA .topbar nav{display:none}
  .cA .topbar .login{margin-left:auto}
  .cA .fork{flex-wrap:wrap;height:auto;border-bottom:0;align-items:stretch;gap:12px}
  .cA .fork svg.lineover{display:none}
  .cA .bar.big{flex:1 1 100%;height:auto;min-height:170px;border-radius:18px}
  .cA .bar.small{flex:1 1 calc(50% - 6px);height:auto;min-height:96px;border-radius:14px}
  .cA .fork:hover .bar.big:not(:hover){filter:none}
  .cA .cols{grid-template-columns:1fr}
  .cA .maparea{max-width:300px;margin:auto}
  .cA .sc{grid-template-columns:58px 1fr}
  .cA .sc .cta{grid-column:2}
  .cA .stairs{grid-template-columns:1fr}
  .cA .stair{min-height:0;border-radius:14px}
  .cA .after .grid{grid-template-columns:1fr 1fr}
  .cA .news{grid-template-columns:1fr}
  .cA.chose .fork .bar.sel{height:auto;min-height:110px}
  .cA .back{position:static;transform:none;align-self:flex-start;margin-top:10px}
}

/* =========================================================
   B：數據編輯風（深色）
   ========================================================= */
.cB{--bgB:#0D1A24;--panel:#13242F;--gridc:rgba(140,190,210,.08);--tx:#ECF3F6;--tx2:#A9BCC7;--hot:#FF9A45;--sky2:#5BB8E8;--teal2:#3CC5CF;
  background:var(--bgB);color:var(--tx);
  background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:44px 44px}
.cB .topbar{color:var(--tx)}
.cB .mono{font-family:var(--f-mono);letter-spacing:.04em}
.cB .ticker{border-block:1px solid rgba(255,255,255,.12);overflow:hidden;white-space:nowrap;font:500 .82rem var(--f-mono);color:var(--tx2)}
.cB .ticker div{display:inline-flex;gap:40px;padding:9px 0;animation:ticker 38s linear infinite}
.cB .ticker b{color:var(--hot);font-weight:600}
.cB .hero{padding:44px 0 36px}
.cB .kicker{font:600 .82rem var(--f-mono);color:var(--teal2);letter-spacing:.12em}
.cB .big{font-size:clamp(3rem,1.4rem + 7vw,7rem);line-height:1.02;margin-top:14px;letter-spacing:-.01em}
.cB .big span{color:var(--hot)}
.cB .ask{margin-top:36px;font:800 clamp(1.4rem,1rem + 1.8vw,2.3rem)/1.5 var(--f-head);display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.cB .opt{font:inherit;background:none;border:0;color:var(--tx);cursor:pointer;padding:0 4px;position:relative;display:inline-flex;align-items:baseline;gap:10px}
.cB .opt::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:6px;border-radius:3px;background:var(--c);transform-origin:left;transition:transform .35s}
.cB .opt:not(.sel)::after{transform:scaleX(.18)}
.cB .opt:hover::after{transform:scaleX(1)}
.cB .opt small{font:600 .9rem var(--f-mono);color:var(--tx2)}
.cB .opt.sel{color:var(--c)}
.cB .or{color:var(--tx2);font-weight:500}
.cB .others{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 24px;font-size:.95rem;color:var(--tx2)}
.cB .others button{background:none;border:0;color:var(--tx2);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:4px}
.cB .figs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:44px;border-top:1px solid rgba(255,255,255,.18)}
.cB .figs div{padding:16px 16px 0 0;border-right:1px solid rgba(255,255,255,.08)}
.cB .figs b{display:block;font:800 3.2rem/1 var(--f-head);color:var(--c)}
.cB .figs span{font:500 .78rem var(--f-mono);color:var(--tx2)}
.cB .path{padding:8px 0 56px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.cB .path .ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-top:1px solid rgba(255,255,255,.18);padding-top:20px}
.cB .path h3{font-size:clamp(1.6rem,1rem + 2vw,2.6rem)}
.cB .panel{background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:20px}
.cB .chart{width:100%;height:auto;display:block;overflow:visible}
.cB .chart text{fill:var(--tx2);font:500 11px var(--f-mono)}
.cB .chart .lane{stroke:rgba(255,255,255,.1)}
.cB .chart .pt{cursor:pointer;transition:r .2s}
.cB .chart .pt:hover,.cB .chart .pt.on{stroke:#fff;stroke-width:3}
.cB .chart .rl{fill:var(--tx);font:800 14px var(--f-head)}
.cB .chart .today{stroke:var(--hot);stroke-dasharray:4 4}
.cB .legend{display:flex;flex-wrap:wrap;gap:14px;font:500 .78rem var(--f-mono);color:var(--tx2);margin-top:10px}
.cB .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
.cB .detail{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:20px}
.cB .card{border-left:4px solid var(--c);padding:6px 0 6px 16px}
.cB .card .d{font:800 2.4rem/1 var(--f-head)}

.cC{background:#F3F6F8;color:var(--ink)}

.cC .t{border-radius:28px;padding:24px;position:relative;overflow:hidden;min-width:0}

.cC .intro p{color:var(--ink-2);max-width:26em}

.cC .way.data:hover{transform:translateY(-6px) rotate(.6deg)}
.cC .way.train{background:var(--blue)}
.cC .way.data{background:var(--orange)}
.cC .way .k{font:700 .85rem var(--f-body);letter-spacing:.08em;opacity:.85}
.cC .way h2{font-size:clamp(2rem,1.2rem + 3vw,3.4rem);position:relative;z-index:1}
.cC .way p{font-size:1.02rem;max-width:18em;position:relative;z-index:1;opacity:.95}
.cC .way .go{margin-top:auto;position:relative;z-index:1;display:inline-flex;align-items:center;gap:10px;align-self:flex-start;background:#fff;color:var(--ink);border-radius:999px;padding:12px 20px;font-weight:800}
.cC .shape{position:absolute;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.cC .way.train .s1{width:260px;height:260px;border-radius:50%;background:#2E77C2;right:-60px;bottom:-70px}
.cC .way.train .s2{width:120px;height:120px;border-radius:50%;border:22px solid #8BC3EC;right:140px;top:-30px}
.cC .way.train .s3{width:70px;height:70px;border-radius:20px;background:var(--orange);right:46px;top:46%}
.cC .way.train:hover .s1{transform:scale(1.12)}
.cC .way.train:hover .s2{transform:translate(-20px,20px) rotate(40deg)}
.cC .way.train:hover .s3{transform:rotate(45deg) translate(10px,-10px)}

.cC .mini .k{font-size:.8rem;font-weight:700;color:var(--soft);letter-spacing:.06em}
.cC .mini b{font:800 1.3rem/1.3 var(--f-head)}

.cC .mini.sky{background:#DCEFF8}

.cC .mini .num{font:800 2.6rem/1 var(--f-head)}

    +'<div class="t mini sky"><span class="k">計畫規模</span><span class="num">22</span><span>縣市＋國教署參與</span><button data-a="toast" data-t="關於計畫頁">了解計畫 '+ic('arrow')+'</button></div>';
  if(ch==='train'){
    h += '<div class="path"><div class="t regions"><span class="k" style="font-weight:800">你在哪一區？</span><div class="pills">'+Object.keys(RN).map(k=>'<button class="pill" data-a="region" data-v="'+k+'" aria-pressed="'+(S.region===k)+'">'+RN[k]+'</button>').join('')+'</div><p style="font-size:.9rem;color:var(--soft)">選了區域，右邊會列出最近的場次。</p></div>'
      +'<div class="t list">'+inRegion().map((s,i)=>'<div class="row" style="animation-delay:'+(i*.07)+'s"><div class="d" style="--c:'+LV[s.c][2]+'">'+s.d+'<small>週'+s.w+'</small></div><div><h4>'+lvlName(s)+'｜'+LV[s.c][1]+'</h4><p>'+s.v+'・名額 '+s.n+'/'+s.cap+'</p></div><span class="go2">'+(s.c==='T'?'縣市推薦':'看場次 →')+'</span></div>').join('')+'</div>'
      +'<div class="t lv3" style="background:var(--sky)"><span class="n">01</span><b>初階・3 小時</b><span>不限資格，先打基礎</span></div>'
      +'<div class="t lv3" style="background:var(--teal)"><span class="n">02</span><b>進階・6 小時</b><span>依職務分流，用真實資料練習</span></div>'
      +'<div class="t lv3" style="background:var(--blue)"><span class="n">03</span><b>開通分析平台</b><span>結業當下自動開通</span></div>'
      +'<div class="t" style="grid-column:1/-1;background:#FDF0E4;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between"><span><b>講師培訓</b>是另一條路：由縣市推薦，兩天 12 小時。</span><button class="btn p" data-a="toast" data-t="研習 › 找場次">看全部場次</button></div></div>';
  } else if(ch==='data'){
    h += '<div class="path"><div class="t tryt">'+tryBox()+'</div>'
      +'<div class="t lv3" style="background:var(--sky)"><span class="n">01</span><b>完成初階研習</b><span>3 小時，不限資格</span></div>'
      +'<div class="t lv3" style="background:var(--teal)"><span class="n">02</span><b>完成進階研習</b><span>結業當下自動開通</span></div>'
      +'<div class="t lv3" style="background:var(--orange)"><span class="n">03</span><b>同一組帳號進入</b><span>不用再註冊</span></div>'
      +'<div class="t" style="grid-column:1/-1;background:#fff;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between"><span>'+ic('lock')+' 資料在你的電腦上去識別，AI 只看統計摘要。</span><button class="btn s" data-a="choose" data-v="train">我還沒上研習 → 找場次</button></div></div>';
  }
  h += '</div></div>';
  return '<div class="p cC'+(ch?' chose':'')+'">'+h+'</div>';
}

/* ---------- 說明 ---------- */
const NOTES = {
  A:['#1B5FA6','A・長條就是介面','LOGO 的四根長條直接變成入口：兩根大的是「參加研習」「用數據分析」，兩根小的是「了解計畫」「承辦／講師」，上面用虛線連成 LOGO 的折線。',
    ['識別度最高，跟計畫 LOGO 一脈相承','動態有意義：選了的那根長條撐滿版面，變成那條路的標題','研習路徑做成「往上走的階梯」，延續長條的意象'],
    ['四根長條高低不同，需要靠文字說明哪個是主要入口','手機上長條改成卡片，長條的意象會變弱'],
    '把滑鼠移到長條上看它長高；點「參加研習」，再點地圖上的區域。'],
  B:['#0D1A24','B・數據編輯風','深色方格紙背景、超大標題、等寬字體的數據標籤，像數據新聞報導。分岔口是一句話：「我想 參加研習 或 分析學校的數據」。',
    ['最有專業感和衝擊力，適合對外展示、長官簡報','場次用「時間軸點陣圖」呈現：一眼看出哪一區、哪個月有課','上方跑馬燈持續露出近期場次'],
    ['深色版面要特別注意文字對比，才能通過無障礙檢測','對部分老師來說可能偏冷、偏硬'],
    '點「參加研習」，再點時間軸上的圓點；或點「分析學校的數據」玩 30 秒試玩。'],
  C:['#EE7A1D','C・色塊拼貼','大圓角色塊（bento 格狀）：兩大塊是兩條路，旁邊的小塊放最近一場、最新消息和計畫規模。滑鼠移上去，色塊裡的幾何形狀會動。',
    ['最親切活潑，符合老師族群','一屏同時看到兩條路和最新資訊，資訊密度最高','選了之後格子重組，只留下那條路的內容'],
    ['色塊多，日後內容一多容易變雜','風格較休閒，正式感比 A、B 弱'],
    '把滑鼠移到藍色和橘色大塊上看形狀變化；點進去後選區域。']
};

/* ---------- 繪製 ---------- */
function render(){
  $('t-c').innerHTML=[['A','A 長條就是介面'],['B','B 數據編輯風'],['C','C 色塊拼貼']].map(([k,t])=>'<button data-tool="c" data-v="'+k+'" aria-pressed="'+(S.c===k)+'">'+t+'</button>').join('');
  $('t-vp').innerHTML=[['desk','桌機'],['phone','手機']].map(([k,t])=>'<button data-tool="vp" data-v="'+k+'" aria-pressed="'+(S.vp===k)+'">'+t+'</button>').join('');
  $('t-notes').textContent=S.notes?'隱藏說明':'顯示說明';
  $('browser').className='browser'+(S.vp==='phone'?' phone':'');
  $('work').className='work'+(S.notes?'':' nonotes');
  $('frame').innerHTML=({A,B,C})[S.c]()+(S.toast?'<div class="toast" role="status">'+S.toast+'</div>':'');
  const n=NOTES[S.c];
  $('notes').hidden=!S.notes;
  $('notes').innerHTML='<span class="tag" style="--c:'+n[0]+'">方向 '+S.c+'</span><h2>'+n[1]+'</h2><p style="margin-top:8px">'+n[2]+'</p><h3>優點</h3><ul>'+n[3].map(t=>'<li>'+t+'</li>').join('')+'</ul><h3>要注意</h3><ul>'+n[4].map(t=>'<li>'+t+'</li>').join('')+'</ul><div class="tip"><b>試試看：</b>'+n[5]+'</div>';
  requestAnimationFrame(drawALine);
  const fk=$('frame').querySelector('.cA .fork'); if(fk) fk.addEventListener('transitionend',drawALine);
  bindDrag();
}
function bindDrag(){
  const chip=$('chipfile'),zone=$('dropzone'); if(!chip||!zone) return;
  chip.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain','file')});
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over')});
  zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
  zone.addEventListener('drop',e=>{e.preventDefault();S.step=1;render()});
}
let tt;
function toast(t){S.toast=t;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast='';render()},2600)}
const ACT={
  choose:d=>{S.choice=d.v;S.step=0;render();$('frame').scrollIntoView({block:'start'});window.scrollTo({top:0})},
  home:()=>{S.choice=null;render()},
  region:d=>{S.region=d.v;render()},
  pick:d=>{S.pick=+d.v;render()},
  trynext:()=>{S.step=Math.min(2,S.step+1);render()},
  tryreset:()=>{S.step=0;render()},
  toast:d=>toast('示意：'+d.t)
};
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-tool]');
  if(t){if(t.dataset.tool==='c'){S.c=t.dataset.v}else{S.vp=t.dataset.v}render();return}
  const a=ev.target.closest('[data-a]');
  if(a&&ACT[a.dataset.a]){ev.preventDefault();ev.stopPropagation();ACT[a.dataset.a](a.dataset)}
});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('g[data-a],circle[data-a]')){ev.preventDefault();ACT[ev.target.dataset.a](ev.target.dataset)}});
$('t-notes').addEventListener('click',()=>{S.notes=!S.notes;render()});
$('t-reset').addEventListener('click',()=>{S.choice=null;S.step=0;render()});
addEventListener('resize',()=>requestAnimationFrame(drawALine));
render();
</script>
</body>
</html>

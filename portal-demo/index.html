<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>研習入口網示範</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
</head>
<body>
<style>
/* Layout: 主站同一套淺色系（顏色取自 LOGO）。上方深色「示範列」不屬於產品本身；
   下方是入口網：左側依身分分組的選單，右側工作區。刻意只做淺色版，與主站一致。 */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --paper:#F4F8FA; --mist:#EAF5F7; --peach:#FFF3E6; --line:#E1E9EE;
  --ink:#1E2B38; --soft:#5B6B7A;
  --blue:#1B5FA6; --blue-dk:#164E89; --teal:#0E6E7A; --orange:#EE7A1D; --orange-tx:#B45309;
  --good:#1F7A4D; --good-bg:#E6F4EC; --bad:#B42318; --bad-bg:#FDECEA; --info-bg:#E8F0FA;
  --demo:#1E2B38; --demo-2:#2C3E50; --demo-tx:#F4F8FA;
  --f-head:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.7 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--blue)}
:focus-visible{outline:3px solid #2185B5;outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-head);font-weight:800;line-height:1.35;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.muted{color:var(--soft)} .small{font-size:.88rem} .num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 示範列 */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--demo);color:var(--demo-tx)}
.demobar .in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px;max-width:1240px;margin:auto}
.demotag{font:700 .72rem/1 var(--f-body);letter-spacing:.08em;background:var(--orange);color:#fff;padding:5px 8px;border-radius:6px}
.demobar label{font-size:.85rem;color:#C9D6E2}
.demobar select{font:inherit;font-size:.9rem;padding:6px 10px;border-radius:8px;border:1px solid #4A6076;background:var(--demo-2);color:var(--demo-tx);width:auto;max-width:100%}
.demobar .sp{flex:1}
.dbtn{font:500 .85rem/1 var(--f-body);color:var(--demo-tx);background:transparent;border:1px solid #4A6076;border-radius:8px;padding:8px 10px;cursor:pointer;white-space:nowrap}
.dbtn:hover{background:var(--demo-2)}
.dbtn .cnt{display:inline-block;min-width:1.4em;margin-left:4px;padding:1px 5px;border-radius:99px;background:var(--orange);color:#fff;font-size:.75rem}
.hint{background:var(--demo-2);color:#DCE6EF;font-size:.86rem}
.hint .in{padding:6px 16px}
.hint b{color:#FFC48A;font-weight:700}

/* 產品頂欄 */
.top{border-bottom:1px solid var(--line);background:var(--bg)}
.top .in{display:flex;align-items:center;gap:14px;max-width:1240px;margin:auto;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.02rem/1.2 var(--f-head);color:var(--ink);text-decoration:none}
.brand svg{width:34px;height:30px;flex:none}
.brand small{display:block;font:500 .75rem/1.3 var(--f-body);color:var(--soft)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.9rem;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--mist);color:var(--teal);font:800 .95rem/1 var(--f-head);flex:none}
.who .nm{font-weight:700;line-height:1.3}
.who .rl{color:var(--soft);font-size:.8rem;line-height:1.3}
@media (max-width:560px){.who .txt{display:none}.brand small{display:none}}

/* 版面 */
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;max-width:1240px;margin:auto;padding:24px 16px 64px}
.side{position:sticky;top:120px;align-self:start}
.side .grp{font-size:.74rem;font-weight:700;letter-spacing:.08em;color:var(--soft);margin:16px 10px 4px}
.side .grp:first-child{margin-top:0}
.side button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;text-align:left;font:500 .95rem/1.3 var(--f-body);color:var(--ink);background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer}
.side button:hover{background:var(--paper)}
.side button[aria-current="page"]{background:var(--mist);color:var(--teal);font-weight:700}
.badge{font:700 .72rem/1 var(--f-body);background:var(--orange);color:#fff;border-radius:99px;padding:3px 7px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;gap:16px;padding-top:12px}
  .side{position:static;display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .side .grp{display:none}
  .side button{width:auto;white-space:nowrap;flex:none}
}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.phead p{color:var(--soft);margin-top:4px}

/* 元件 */
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.tint{background:var(--paper);border-color:transparent}
.card>h2+*,.card>h3+*{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;font:700 .92rem/1 var(--f-body);border:2px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:var(--blue-dk)}
.btn-l{background:var(--bg);color:var(--blue);border-color:var(--blue)}.btn-l:hover{background:var(--mist)}
.btn-g{background:var(--paper);color:var(--ink)}.btn-g:hover{background:var(--line)}
.btn-d{background:var(--bg);color:var(--bad);border-color:#F2C4BF}.btn-d:hover{background:var(--bad-bg)}
.btn-s{min-height:32px;padding:0 12px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font:700 .78rem/1 var(--f-body);padding:5px 9px;border-radius:99px;white-space:nowrap;background:var(--paper);color:var(--soft)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--peach);color:var(--orange-tx)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--blue)}
.chip.teal{background:var(--mist);color:var(--teal)}
.why{font-size:.84rem;color:var(--orange-tx)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--peach);border-radius:10px;padding:10px 14px;font-size:.88rem;color:#5A3A12}
.note b{flex:none;font:700 .72rem/1 var(--f-body);letter-spacing:.06em;background:var(--orange);color:#fff;border-radius:5px;padding:5px 6px;margin-top:2px}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;border-radius:var(--r);padding:14px 18px;background:var(--mist);border:1px solid #CDE6EA}
.banner.warn{background:var(--peach);border-color:#F7D8B5}
.kpi{display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.kpi:hover{border-color:var(--blue)}
.kpi b{font:800 1.7rem/1.2 var(--f-head);font-variant-numeric:tabular-nums}
.kpi.hot b{color:var(--orange-tx)}
.kpi span{font-size:.86rem;color:var(--soft)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--paper);font-weight:700;font-size:.8rem;color:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
td .sub{font-size:.8rem;color:var(--soft)}
.course{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.course .hd{padding:16px 20px;background:var(--paper);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;justify-content:space-between}
.course .hd>div{min-width:0}
.course .hd p{color:var(--soft);font-size:.9rem;margin-top:4px}
.sess{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.sess .when{font-weight:700}
.sess .meta{font-size:.86rem;color:var(--soft)}
.sess .act{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
@media (max-width:560px){.sess{grid-template-columns:1fr}.sess .act{align-items:flex-start;text-align:left}}
.steps{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;list-style:none;padding:0}
.steps li{font-size:.78rem;padding:4px 10px;border-radius:99px;background:var(--paper);color:var(--soft)}
.steps li.done{background:var(--good-bg);color:var(--good)}
.steps li.now{background:var(--blue);color:#fff;font-weight:700}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:center}
.tick{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 .8rem/1 var(--f-body);flex:none;background:var(--paper);color:var(--soft)}
.tick.ok{background:var(--good);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:6px}

/* 表單 */
form.f{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.fld>.lb{font-weight:700;font-size:.88rem}
.fld .help{font-size:.8rem;color:var(--soft)}
input[type=text],input[type=email],input[type=password],select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid #C9D5DE;border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:84px;resize:vertical}
input[readonly]{background:var(--paper)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:500;cursor:pointer}
.err{color:var(--bad);font-size:.85rem}

/* 對話框、通知 */
.ov{position:fixed;inset:0;z-index:50;background:rgba(30,43,56,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.dlg{background:var(--bg);border-radius:16px;width:min(640px,100%);padding:22px 24px;box-shadow:0 20px 50px -20px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:14px}
.dlg.wide{width:min(860px,100%)}
.dlg .x{align-self:flex-end;margin:-8px -8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.mail{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.mail .mh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:.82rem;color:var(--soft)}
.mail .sj{font-weight:700}
.mail .bd{font-size:.9rem;white-space:pre-line}

/* 研習證明 */
.certdoc{border:2px solid var(--teal);border-radius:6px;padding:28px 28px 22px;background:linear-gradient(180deg,var(--mist),var(--bg) 40%);text-align:center;display:flex;flex-direction:column;gap:12px}
.certdoc h2{font-size:1.6rem;letter-spacing:.3em;color:var(--teal)}
.certdoc .body{font-size:1rem;line-height:2;text-align:left}
.certdoc .body b{font-family:var(--f-head);font-size:1.1rem}
.certdoc .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;text-align:left;font-size:.82rem;color:var(--soft);border-top:1px dashed var(--line);padding-top:12px}
.certdoc svg{width:72px;height:72px;flex:none}
.code{font:700 .95rem/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;color:var(--ink)}
pre.csv{margin:0;padding:12px;background:var(--paper);border-radius:8px;font:.82rem/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto;white-space:pre}
footer{max-width:1240px;margin:auto;padding:0 16px 40px;color:var(--soft);font-size:.82rem}
</style>

function fakeId(n){const L='EFSDABTHK';return L[n%L.length]+(n%2?'1':'2')+'2****'+String(100+(n*37)%900)}

function issueCert(st,r){

}

function ended(s){return (s.date2||s.date)<TODAY}
function sessWhen(s){return md(s.date)+(s.date2?'、'+md(s.date2):'')}

function active(r){return !['cancelled','rejected'].includes(r.status)}
function taken(s){return st.regs.filter(r=>r.sess===s.id&&['admitted','attended','completed','reported'].includes(r.status)).length}
function done(uid,cid){return st.regs.some(r=>r.user===uid&&['completed','reported'].includes(r.status)&&SS(r.sess).course===cid)}

function elig(u,s){
  const c=C(s.course);
  if(!u)return{ok:false,why:'登入或註冊後即可報名',login:true};
  if(!has(u,'learner'))return{ok:false,why:'此身分不能報名'};
  if(!u.verified)return{ok:false,why:'請先完成 email 驗證'};
  const mine=st.regs.find(r=>r.user===u.id&&active(r)&&SS(r.sess).course===c.id);
  if(mine)return{ok:false,why:mine.sess===s.id?'你已報名這個場次':'你已報名本課程的其他場次',mine:true};
  if(ended(s))return{ok:false,why:'已結束'};
  if(!s.open)return{ok:false,why:'尚未開放報名'};
  if(c.elig==='track'){
    if(s.track&&u.job!==s.track)return{ok:false,why:'此分流限'+JOB[s.track]+'（你的職務是'+(JOB[u.job]||'未填')+'）'};
    if(!done(u.id,'A'))return{ok:false,why:'需先完成初階研習'};
  }
  if(c.elig==='invite'&&!st.invites.some(i=>i.course===c.id&&i.user===u.id&&i.status==='accepted'))return{ok:false,why:'採縣市推薦，限收到邀請的人報名'};
  if(taken(s)>=s.cap)return{ok:true,full:true};
  return{ok:true};
}

    h+='<div class="card"><div class="row" style="justify-content:space-between"><div><h3>'+esc(C(s.course).name)+'</h3><p class="small muted">'+esc(sessName(s))+'・'+esc(s.venue)+'</p></div><div class="row">'+stChip(r.status)+(canCancel?'<button class="btn btn-d btn-s" data-act="cancel" data-id="'+r.id+'">取消報名</button>':'')+'</div></div>'+tl+(r.files?'<p class="small muted" style="margin-top:8px">已附先修證明：'+r.files.map(esc).join('、')+'</p>':'')+'</div>';
  });
  return h;
};

/* 講師 */
V.teach=u=>{
  const list=st.sessions.filter(s=>s.lect===u.id).sort((a,b)=>a.date<b.date?-1:1);
  let h='<div class="phead"><div><h1>我的授課</h1><p>承辦指派給你的場次。</p></div></div>';
  h+='<div class="tw"><table><thead><tr><th>場次</th><th>地點</th><th>學員</th><th>狀態</th><th></th></tr></thead><tbody>';
  list.forEach(s=>{
    const n=st.regs.filter(r=>r.sess===s.id&&['admitted','attended','absent','completed','reported'].includes(r.status)).length;
    const stt=!ended(s)?chip('即將開始','info'):s.roll?chip('已點名','good'):chip('待點名','warn');
    h+='<tr><td>'+esc(sessName(s))+'</td><td>'+esc(s.venue)+'</td><td class="num">'+n+'</td><td>'+stt+'</td><td>'+(ended(s)&&!s.roll?'<button class="btn btn-p btn-s" data-act="roll" data-id="'+s.id+'">去點名</button>':'<button class="btn btn-g btn-s" data-act="roster" data-id="'+s.id+'">學員名單</button>')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+=note('講師只看得到自己場次的學員姓名與服務單位，看不到身分證字號、email 等資料。');

};
V.roll=u=>{
  const pool=st.sessions.filter(s=>ended(s)&&(has(u,'staff')||s.lect===u.id)&&st.regs.some(r=>r.sess===s.id&&r.status==='admitted'));
  let h='<div class="phead"><div><h1>點名</h1><p>研習結束後登記每位學員是否出席，承辦會依此核發結業。</p></div></div>';
  if(!pool.length)return h+'<div class="card tint"><p>沒有待點名的場次。</p></div>'+note('之後可以改成學員現場掃 QR code 自行簽到，講師只要確認。');
  if(!pool.some(s=>s.id===st.rollSid)){st.rollSid=pool[0].id;st.rollMarks={}}
  const s=SS(st.rollSid);
  const list=st.regs.filter(r=>r.sess===s.id&&r.status==='admitted');
  h+='<div class="card"><div class="row" style="justify-content:space-between"><div class="fld" style="flex:1 1 260px"><label for="rollsel">場次</label><select id="rollsel" data-chg="rollsel">'+pool.map(x=>'<option value="'+x.id+'"'+(x.id===s.id?' selected':'')+'>'+esc(sessName(x))+'</option>').join('')+'</select></div><button class="btn btn-l btn-s" data-act="rollall">全部標為出席</button></div></div>';
  h+='<div class="tw"><table><thead><tr><th>學員</th><th>服務單位</th><th>出席</th></tr></thead><tbody>';
  list.forEach(r=>{const p=U(r.user),m=st.rollMarks[r.id];
    h+='<tr><td>'+esc(p.name)+'</td><td>'+esc(p.org)+'</td><td><div class="row"><button class="btn btn-s '+(m==='attended'?'btn-p':'btn-g')+'" data-act="mark" data-id="'+r.id+'" data-v="attended" aria-pressed="'+(m==='attended')+'">出席</button><button class="btn btn-s '+(m==='absent'?'btn-d':'btn-g')+'" data-act="mark" data-id="'+r.id+'" data-v="absent" aria-pressed="'+(m==='absent')+'">缺席</button></div></td></tr>'});
  const left=list.filter(r=>!st.rollMarks[r.id]).length;
  h+='</tbody></table></div><div class="row"><button class="btn btn-p" data-act="rollsubmit" '+(left?'disabled':'')+'>送出點名結果</button><span class="small muted">'+(left?'還有 '+left+' 位未標記':'全部已標記')+'</span></div>';
  h+=note('之後可以改成學員現場掃 QR code 自行簽到，講師只要確認。');
  return h;
};
V.lectq=u=>{
  const L=u.lect, taught=st.sessions.filter(s=>s.lect===u.id&&ended(s));

  h+='<div class="card"><h2>講師檔案</h2><form class="f" data-form="lect"><div class="fld"><span class="lb">可授課區域</span><div class="radios">'+['北區','中區','南區','東區'].map(r=>'<label><input type="checkbox" name="regions" value="'+r+'"'+(L.regions.includes(r)?' checked':'')+'>'+r+'</label>').join('')+'</div></div>'
   +'<div class="fld"><label for="l-tags">專長（以頓號分隔）</label><input id="l-tags" name="tags" type="text" value="'+esc(L.tags.join('、'))+'"></div>'

/* 縣市承辦 */
V.nominate=u=>{
  const mine=st.invites.filter(i=>i.county===u.county&&i.course==='T');
  const used=mine.filter(i=>i.status!=='withdrawn').length;
  let h='<div class="phead"><div><h1>講師培訓推薦</h1><p>'+esc(C('T').name)+'・'+esc(u.county)+'名額 <b class="num">'+used+' / '+QUOTA+'</b></p></div></div>';
  h+='<div class="tw"><table><thead><tr><th>被推薦人</th><th>服務單位</th><th>邀請狀態</th><th>報名狀態</th><th></th></tr></thead><tbody>';
  mine.forEach(i=>{
    const r=i.user&&st.regs.find(x=>x.user===i.user&&SS(x.sess).course==='T'&&active(x));
    const is={sent:chip('已寄邀請・未回應','warn'),accepted:chip('已接受','good'),withdrawn:chip('已撤回')}[i.status];
    h+='<tr><td>'+esc(i.name)+'<div class="sub">'+esc(i.email)+'</div></td><td>'+esc(i.org)+'</td><td>'+is+'<div class="sub">寄出 '+esc(i.sent)+'</div></td><td>'+(r?stChip(r.status)+'<div class="sub">'+esc(SS(r.sess).region)+'場</div>':'<span class="muted small">尚未報名</span>')+'</td><td>'+(i.status==='sent'?'<div class="row"><button class="btn btn-g btn-s" data-act="resend" data-id="'+i.id+'">重寄</button><button class="btn btn-d btn-s" data-act="withdraw" data-id="'+i.id+'">撤回</button></div>':'')+'</td></tr>';
  });
  if(!mine.length)h+='<tr><td colspan="5" class="muted">尚未推薦</td></tr>';
  h+='</tbody></table></div>';
  if(used<QUOTA){
    h+='<div class="card"><h2>新增推薦</h2><form class="f" data-form="nominate"><div class="fgrid"><div class="fld"><label for="n-name">姓名</label><input id="n-name" name="name" type="text" required></div><div class="fld"><label for="n-email">Email</label><input id="n-email" name="email" type="email" required placeholder="建議填常用信箱"></div><div class="fld"><label for="n-org">服務單位</label><input id="n-org" name="org" type="text" required></div></div><div class="row"><button class="btn btn-p" type="submit">推薦並寄出邀請</button><span class="small muted">被推薦人會收到邀請信，點連結就能報名。</span></div></form></div>';
  }else h+='<div class="card tint"><p>名額已用完。撤回未回應的推薦可以釋出名額。</p></div>';
  h+=note('縣市直接在平台推薦，取代交 Excel 表格。被推薦人點邀請信就能報名，就算 email 跟帳號不同也能綁定；承辦也看得到誰還沒回應。');
  return h;
};

  ppl.forEach(p=>{h+='<tr><td>'+esc(p.name)+'</td><td>'+esc(p.org)+'</td><td>'+esc(JOB[p.job])+'</td><td>'+(done(p.id,'A')?chip('結業','good'):'—')+'</td><td>'+(done(p.id,'B')?chip('結業','good'):'—')+'</td><td>'+(entitled(p.id)?chip('已開通','teal'):'—')+'</td></tr>'});

/* 計畫承辦 */
V.dash=()=>{
  const pend=st.regs.filter(r=>r.status==='pending').length;
  const roll=st.sessions.filter(s=>ended(s)&&!s.roll&&st.regs.some(r=>r.sess===s.id&&r.status==='admitted')).length;
  const att=st.regs.filter(r=>r.status==='attended').length;
  const comp=st.regs.filter(r=>r.status==='completed').length;
  const rev=st.reviews.filter(r=>r.status==='submitted').length;
  const inv=st.invites.filter(i=>i.status==='sent').length;
  const k=(n,t,s,v)=>'<button class="kpi'+(n?' hot':'')+'" data-act="go" data-v="'+v+'"><span>'+t+'</span><b>'+n+'</b><span>'+s+'</span></button>';
  let h='<div class="phead"><div><h1>總覽</h1><p>今天是 '+md(TODAY)+'。數字是待處理的件數，點進去處理。</p></div></div><div class="grid3">'
    +k(pend,'待審核報名','含先修證明檢視','review')
    +k(roll,'待點名場次','等講師點名，或由承辦代點','complete')
    +k(att,'待核發結業','已出席、尚未結業的人數','complete')
    +k(comp,'待登錄全教網','已結業、尚未登錄的人數','complete')
    +k(rev,'待審講師認證','公版簡報與試教影片','lecturers')
    +k(inv,'推薦邀請未回應','可提醒縣市或重寄','invites')
    +'</div>';
  const nol=st.sessions.filter(s=>!ended(s)&&!s.lect);
  if(nol.length)h+='<div class="banner warn"><span>有 '+nol.length+' 個場次還沒指派講師。</span><button class="btn btn-l btn-s" data-act="go" data-v="lecturers">去指派</button></div>';
  h+='<div class="card"><h2>近期場次</h2><div class="tw" style="margin-top:12px"><table><thead><tr><th>場次</th><th>地點</th><th>錄取／名額</th><th>待審</th><th>講師</th></tr></thead><tbody>';
  st.sessions.filter(s=>!ended(s)).sort((a,b)=>a.date<b.date?-1:1).forEach(s=>{h+='<tr><td>'+esc(sessName(s))+'</td><td>'+esc(s.venue)+'</td><td class="num">'+taken(s)+' / '+s.cap+'</td><td class="num">'+st.regs.filter(r=>r.sess===s.id&&r.status==='pending').length+'</td><td>'+(s.lect?esc(U(s.lect).name):chip('未指派','warn'))+'</td></tr>'});
  return h+'</tbody></table></div></div>';
};

function render(){
  const u=me();
  $('#persona').innerHTML='<option value="">訪客（未登入）</option>'+st.users.filter(x=>x.persona).map(x=>'<option value="'+x.id+'"'+(x.id===st.cur?' selected':'')+'>'+esc(x.name)+'｜'+esc(x.persona)+'</option>').join('');
  if(!u)$('#persona').value='';
  $('#hint').innerHTML='<b>試試看：</b>'+(u?(u.hint||'新帳號要先驗證 email 才能報名。'):'註冊一個新帳號，再到<b>示範信箱</b>點驗證信；或在<b>證書查驗</b>輸入查驗碼。');
  $('#mailcnt').textContent=st.mails.length;
  $('#notesbtn').textContent=st.notes?'隱藏討論註記':'顯示討論註記';
  $('#who').innerHTML=u?'<div class="txt" style="text-align:right"><div class="nm">'+esc(u.name)+'</div><div class="rl">'+esc(u.org)+'</div></div><div class="avatar" aria-hidden="true">'+esc(u.name[0])+'</div>':'<button class="btn btn-l btn-s" data-act="go" data-v="signup">登入／註冊</button>';
  const groups=navFor(u), all=groups.flatMap(g=>g[1].map(i=>i[0]));
  if(!all.includes(st.view)&&!(st.view==='roll'&&has(u,'staff')))st.view=all[0];
  $('#side').innerHTML=groups.map(([g,items])=>'<div class="grp">'+g+'</div>'+items.map(([k,t])=>'<button data-act="go" data-v="'+k+'"'+(st.view===k?' aria-current="page"':'')+'><span>'+t+'</span>'+badgeFor(k,u)+'</button>').join('')).join('');
  $('#main').innerHTML=V[st.view](u);
  save();
}

  },
  mailgo:d=>{
    const m=st.mails.find(x=>x.id===d.id);if(!m)return;

      +(c.proof?'<div class="fld"><label for="a-file">先修證明（'+c.proof.join('、')+'）</label><input id="a-file" name="file" type="file" multiple accept=".pdf,.jpg,.png"><span class="help">沒選檔案的話，示範會自動附上範例檔。</span></div>':'')
      +'<div class="fld"><span class="lb">午餐</span><div class="radios">'+['葷','素','不用餐'].map((m,i)=>'<label><input type="radio" name="meal" value="'+m+'"'+(i?'':' checked')+'>'+m+'</label>').join('')+'</div></div>'
      +'<div class="fld"><label for="a-note">想在研習中解決的資料問題（選填）</label><textarea id="a-note" name="note" placeholder="例如：想看學習扶助測驗各班的落差"></textarea></div>'
      +'<div class="err" id="a-err" hidden></div><div class="row"><button class="btn btn-p" type="submit">送出報名</button><button class="btn btn-g" type="button" data-act="close">取消</button></div></form>'
      +note('每門課要收的資料不同：先做「固定欄位＋每門課幾個自訂題目」，不要一開始就做成萬用表單產生器。'));
  },
  cancel:d=>{modal('<h2>取消這筆報名？</h2><p>取消後名額會釋出給備取的人。</p><div class="row"><button class="btn btn-d" data-act="docancel" data-id="'+d.id+'">取消報名</button><button class="btn btn-g" data-act="close">保留</button></div>')},
  docancel:d=>{st.regs.find(r=>r.id===d.id).status='cancelled';closeModal();render();toast('已取消報名')},
  cert:d=>{
    const c=st.certs.find(x=>x.code===d.id),p=U(c.user);
    modal('<div class="certdoc"><h2>研習證明</h2><div class="body"><b>'+esc(p.name)+'</b>（'+esc(p.org)+'）於 <span class="num">'+esc(c.date)+'</span> 參加<br>教育資料素養提升計畫 '+esc(c.title)+'，<br>研習時數共 <b class="num">'+c.hours+'</b> 小時，特此證明。</div><div class="foot"><div>教育部補助｜國立高雄師範大學執行<br>查驗碼 <span class="code">'+esc(c.code)+'</span><br>可至入口網「證書查驗」核對</div>'+qr(c.code)+'</div></div><p class="small muted">正式版可下載 PDF。右下角是示意的查驗 QR code，掃描後直接開啟查驗結果。</p>',true);
  },
  enter:()=>toast('正式版會直接進入分析平台，不需要再登入一次（共用登入狀態）'),
  roll:d=>{st.rollSid=d.id;st.rollMarks={};st.view='roll';render();window.scrollTo(0,0)},
  roster:d=>{const s=SS(d.id),list=st.regs.filter(r=>r.sess===s.id&&['admitted','attended','absent','completed','reported'].includes(r.status));
    modal('<h2>學員名單</h2><p class="small muted">'+esc(sessName(s))+'</p>'+(list.length?'<div class="tw"><table><thead><tr><th>姓名</th><th>服務單位</th><th>職務</th></tr></thead><tbody>'+list.map(r=>{const p=U(r.user);return '<tr><td>'+esc(p.name)+'</td><td>'+esc(p.org)+'</td><td>'+esc(JOB[p.job])+'</td></tr>'}).join('')+'</tbody></table></div>':'<p class="muted">目前還沒有錄取的學員。</p>'))},
  mark:d=>{st.rollMarks[d.id]=d.v;render()},
  rollall:()=>{st.regs.filter(r=>r.sess===st.rollSid&&r.status==='admitted').forEach(r=>st.rollMarks[r.id]='attended');render()},
  rollsubmit:()=>{const s=SS(st.rollSid);let a=0;st.regs.filter(r=>r.sess===s.id&&r.status==='admitted').forEach(r=>{r.status=st.rollMarks[r.id];if(r.status==='attended')a++});s.roll=true;st.rollMarks={};render();toast('已送出點名：出席 '+a+' 人。承辦會接著核發結業。')},
  resend:d=>{const i=st.invites.find(x=>x.id===d.id);i.sent=TODAY;inviteMail(st,i);render();toast('已重寄邀請信給 '+i.name)},
  withdraw:d=>{const i=st.invites.find(x=>x.id===d.id);i.status='withdrawn';st.mails.forEach(m=>{if(m.action&&m.action.id===i.id)m.used=true});render();toast('已撤回推薦，名額已釋出')},
  decide:d=>{const r=st.regs.find(x=>x.id===d.id);r.status=d.v;const p=U(r.user);st.mails.unshift({id:'m'+Date.now(),to:p.email,date:TODAY,subject:'【教育資料素養提升計畫】報名結果：'+ST[d.v][0],body:p.name+' 您好：\n您報名的「'+sessName(SS(r.sess))+'」審核結果為：'+ST[d.v][0]+'。\n詳情請登入入口網查看「我的報名」。'});render();toast(p.name+'：'+ST[d.v][0]+'，已寄信通知')},
  admitall:()=>{const f=st.reviewFilter;let n=0;st.regs.filter(r=>r.status==='pending'&&(f==='pending'||r.sess===f)).forEach(r=>{r.status='admitted';n++});render();toast('已錄取 '+n+' 人，已寄信通知')},
  graduate:d=>{
    const s=SS(d.id),c=C(s.course);let n=0,g=0;
    st.regs.filter(r=>r.sess===s.id&&r.status==='attended').forEach(r=>{r.status='completed';issueCert(st,r);n++;
      if((c.id==='B'||c.id==='T')&&!entitled(r.user)){st.ents.push({user:r.user,src:c.id==='B'?'完成進階研習（'+JOB[s.track]+'軌）':'完成講師培訓',date:TODAY});g++}});
    render();toast('已核發 '+n+' 張研習證明'+(g?'，並開通 '+g+' 人的分析平台':''));
  },
  export:d=>{
    const s=SS(d.id),c=C(s.course),list=st.regs.filter(r=>r.sess===s.id&&r.status==='completed');
    const rows=list.map(r=>{const p=U(r.user);return [r.idm,p.name,p.org,s.date2||s.date,c.hours]});
    const csv=['身分證字號,姓名,服務單位,研習日期,研習時數'].concat(rows.map(x=>x.join(','))).join('\n');
    st.exportSid=s.id;
    modal('<h2>匯出全教網名單</h2><p class="small muted">'+esc(sessName(s))+'・共 '+rows.length+' 人</p><pre class="csv" id="csvtext">'+esc(csv)+'</pre><p class="small">示範中身分證字號維持遮罩；正式版匯出時才解密完整字號，而且每次匯出都會記錄在稽核紀錄裡。</p><div class="row"><button class="btn btn-l" data-act="copycsv">複製 CSV</button><button class="btn btn-p" data-act="reported" data-id="'+s.id+'">已登錄完成，標記這 '+rows.length+' 人</button></div>',true);
  },
  copycsv:()=>{const t=$('#csvtext').textContent;const sel=()=>{const r=document.createRange();r.selectNodeContents($('#csvtext'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('已選取文字，請按 Ctrl+C 複製')};try{navigator.clipboard.writeText(t).then(()=>toast('已複製 CSV'),sel)}catch(e){sel()}},
  reported:d=>{let n=0;st.regs.filter(r=>r.sess===d.id&&r.status==='completed').forEach(r=>{r.status='reported';n++});closeModal();render();toast(n+' 人已標記為登錄全教網')},
  lectok:d=>{const r=st.reviews.find(x=>x.id===d.id),u=U(r.user);r.status='approved';if(!has(u,'lecturer'))u.roles.push('lecturer');
    const y=Number(TODAY.slice(0,4))+2;u.lect={until:y+TODAY.slice(4),regions:[],tags:[],bio:''};
    if(!entitled(u.id))st.ents.push({user:u.id,src:'具講師資格',date:TODAY});render();toast(u.name+' 已取得講師資格（效期至 '+u.lect.until+'）')},
  lectback:d=>{const r=st.reviews.find(x=>x.id===d.id);r.status='returned';const u=U(r.user);st.mails.unshift({id:'m'+Date.now(),to:u.email,date:TODAY,subject:'【教育資料素養提升計畫】講師認證資料請補件',body:u.name+' 您好：\n您的試教影片需要補充說明，請登入入口網重新上傳。'});render();toast('已退回補件，並寄信通知 '+u.name)},
  toggleopen:d=>{const s=SS(d.id);s.open=!s.open;render();toast(s.open?'已開放報名':'已關閉報名')},
  revoke:d=>{const p=U(d.id);st.ents=st.ents.filter(e=>e.user!==d.id);render();toast('已停用 '+p.name+' 的分析平台權限')}
};
const CHG={
  persona:v=>{st.cur=v||null;st.view=null;closeModal();render();window.scrollTo(0,0)},
  rollsel:v=>{st.rollSid=v;st.rollMarks={};render()},
  rfilter:v=>{st.reviewFilter=v;render()},
  assign:(v,el)=>{const s=SS(el.dataset.id);s.lect=v||null;render();toast(v?'已指派 '+U(v).name:'已取消指派')},
  elig:(v,el)=>{C(el.dataset.id).elig=v;render();toast('已改為「'+ELIG[v][0]+'」')}
};
const FORM={
  signup:(fd,form)=>{
    const email=fd.get('email').trim().toLowerCase();
    if(st.users.some(u=>u.email===email)){toast('這個 email 已經註冊過，請直接登入');return}
    const inv=fd.get('inv')?st.invites.find(i=>i.id===fd.get('inv')):null;
    const u={id:'n'+Date.now(),name:fd.get('name').trim(),email,verified:!!inv,job:fd.get('job'),title:'',org:fd.get('org').trim(),county:fd.get('county'),roles:['learner'],persona:'新註冊帳號'};
    st.users.push(u);st.cur=u.id;
    if(inv){inv.status='accepted';inv.user=u.id;st.mails.forEach(m=>{if(m.action&&m.action.id===inv.id)m.used=true});closeModal();st.view='catalog';render();toast('帳號已建立，邀請已接受')}
    else{st.mails.unshift({id:'m'+Date.now(),to:email,date:TODAY,subject:'【教育資料素養提升計畫】請驗證您的 email',body:u.name+' 您好：\n請點下方按鈕完成 email 驗證，驗證後即可報名研習。',action:{type:'verify',id:u.id,label:'驗證 email'}});
      closeModal();st.view='home';render();toast('帳號已建立，驗證信已寄到示範信箱')}
  },
  apply:(fd,form)=>{
    const id=fd.get('idno').trim().toUpperCase();
    if(!/^[A-Z][1289]\d{8}$/.test(id)){const e=$('#a-err');e.hidden=false;e.textContent='身分證字號格式不對：第 1 碼是英文字母，後面接 9 個數字。';return}
    const s=SS(fd.get('sid')),c=C(s.course),e=elig(me(),s);
    const files=c.proof?([...(form.querySelector('#a-file')||{files:[]}).files].map(f=>f.name)):null;
    st.regs.push({id:'r'+Date.now(),user:st.cur,sess:s.id,status:e.full?'waitlist':'pending',at:TODAY,meal:fd.get('meal'),idm:id.slice(0,3)+'****'+id.slice(-3),note:fd.get('note').trim(),files:c.proof?(files.length?files:c.proof.map(p=>p+'_研習證明（範例）.pdf')):undefined});
    closeModal();st.view='myregs';render();toast('報名已送出，審核結果會寄信通知');
  },
  profile:(fd)=>{const u=me();const old=u.job;['name','job','title','org','county'].forEach(k=>u[k]=fd.get(k).trim());render();toast(old!==u.job?'已儲存。職務已變更，可報名的進階分流也會跟著變。':'已儲存')},
  lect:(fd)=>{const u=me();u.lect.regions=fd.getAll('regions');u.lect.tags=fd.get('tags').split(/[、,，]/).map(s=>s.trim()).filter(Boolean);u.lect.bio=fd.get('bio');render();toast('講師檔案已更新')},
  nominate:(fd)=>{const u=me();const i={id:'i'+Date.now(),course:'T',county:u.county,name:fd.get('name').trim(),email:fd.get('email').trim().toLowerCase(),org:fd.get('org').trim(),status:'sent',user:null,by:u.id,sent:TODAY};
    const ex=st.users.find(x=>x.email===i.email);st.invites.push(i);inviteMail(st,i);render();toast('已推薦 '+i.name+'，邀請信已寄出'+(ex?'（此 email 已有帳號，登入後即可接受）':''))},
  import:(fd)=>{let n=0;fd.get('rows').split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{const [name,email,county,org]=l.split(/[,，]/).map(s=>(s||'').trim());if(!name||!email)return;const i={id:'i'+Date.now()+n,course:'T',county:county||'未填',name,email:email.toLowerCase(),org:org||'',status:'sent',user:null,by:null,sent:TODAY};st.invites.push(i);inviteMail(st,i);n++});render();toast('已匯入 '+n+' 位，邀請信已寄出')},
  grant:(fd)=>{const id=fd.get('user');if(!id)return;st.ents.push({user:id,src:fd.get('src').trim(),date:TODAY});render();toast('已開通 '+U(id).name+' 的分析平台')},
  verify:(fd)=>{const code=fd.get('code').trim().toUpperCase(),c=st.certs.find(x=>x.code===code),box=$('#vres');
    box.innerHTML=c?'<div class="banner"><div><div class="row">'+chip('有效證明','good')+'<span class="code">'+esc(c.code)+'</span></div><p style="margin-top:6px"><b>'+esc(mask(U(c.user).name))+'</b>・'+esc(c.title)+'・'+esc(c.date)+'・'+c.hours+' 小時</p></div></div>':'<div class="banner warn"><span>查無此查驗碼。請確認大小寫與連字號是否正確。</span></div>'}
};
function qr(code){
  let h=0;for(const ch of code)h=(h*31+ch.charCodeAt(0))>>>0;
  let r='';const N=11,c=6.5;
  const fin=(x,y)=>'<rect x="'+x+'" y="'+y+'" width="19.5" height="19.5" fill="none" stroke="#1E2B38" stroke-width="3"/><rect x="'+(x+6)+'" y="'+(y+6)+'" width="7.5" height="7.5" fill="#1E2B38"/>';
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){if((i<3&&j<3)||(i<3&&j>N-4)||(i>N-4&&j<3))continue;h=(h*1103515245+12345)>>>0;if(h&0x10000)r+='<rect x="'+(i*c+1)+'" y="'+(j*c+1)+'" width="'+c+'" height="'+c+'" fill="#1E2B38"/>'}
  return '<svg viewBox="0 0 74 74" role="img" aria-label="查驗 QR code（示意）"><rect width="74" height="74" fill="#FFFFFF"/>'+fin(1.5,1.5)+fin(53,1.5)+fin(1.5,53)+r+'</svg>';
}

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(!f)return;if(el.tagName==='A')ev.preventDefault();f(el.dataset,el,ev)});
document.addEventListener('change',ev=>{const el=ev.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el.value,el)});
document.addEventListener('submit',ev=>{const f=ev.target.closest('form[data-form]');if(!f)return;ev.preventDefault();FORM[f.dataset.form](new FormData(f),f)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#ovroot').innerHTML)closeModal()});

load();render();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>研習入口網後台示範</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 後台：講師、縣市承辦、計畫承辦的工作介面。顏色與字體同主站，版面改成左側選單＋右側工作區，方便處理大量表格。 */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --paper:#F4F8FA; --mist:#EAF5F7; --peach:#FFF3E6; --line:#E1E9EE;
  --ink:#1E2B38; --soft:#5B6B7A;
  --blue:#1B5FA6; --blue-dk:#164E89; --teal:#0E6E7A; --orange-tx:#B45309;
  --f-head:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.7 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--blue)}
:focus-visible{outline:3px solid #2185B5;outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-head);font-weight:800;line-height:1.35;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.muted{color:var(--soft)} .small{font-size:.88rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;font:700 .92rem/1 var(--f-body);border:2px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dk)}
.btn-line{background:var(--bg);color:var(--blue);border-color:var(--blue)}.btn-line:hover{background:var(--mist)}
.btn-sm{min-height:32px;padding:0 12px;font-size:.84rem}
.top{border-bottom:1px solid var(--line);background:var(--bg)}
.top .in{display:flex;align-items:center;gap:14px;max-width:1240px;margin:auto;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.02rem/1.2 var(--f-head);color:var(--ink);text-decoration:none}
.brand img{width:40px;height:auto}
.brand small{display:block;font:500 .75rem/1.3 var(--f-body);color:var(--soft)}
.who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:.9rem;min-width:0}
.who .nm{font-weight:700;line-height:1.3}
.who .rl{color:var(--soft);font-size:.8rem;line-height:1.3}
@media (max-width:600px){.who .txt{display:none}.brand small{display:none}}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;max-width:1240px;margin:auto;padding:24px 16px 64px}
.side{position:sticky;top:16px;align-self:start}
.side .grp{font-size:.74rem;font-weight:700;letter-spacing:.08em;color:var(--soft);margin:16px 10px 4px}
.side .grp:first-child{margin-top:0}
.side button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;text-align:left;font:500 .95rem/1.3 var(--f-body);color:var(--ink);background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer}
.side button:hover{background:var(--paper)}
.side button[aria-current="page"]{background:var(--mist);color:var(--teal);font-weight:700}
.badge{font:700 .72rem/1 var(--f-body);background:var(--orange);color:#fff;border-radius:99px;padding:3px 7px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;gap:16px;padding-top:12px}
  .side{position:static;display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .side .grp{display:none}
  .side button{width:auto;white-space:nowrap;flex:none}
}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.phead p{color:var(--soft);margin-top:4px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.tint{background:var(--paper);border-color:transparent}
.card>h2+*,.card>h3+*{margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.kpi:hover{border-color:var(--blue)}
.kpi.static{cursor:default}.kpi.static:hover{border-color:var(--line)}
.kpi b{font:800 1.7rem/1.2 var(--f-head);font-variant-numeric:tabular-nums}
.kpi.hot b{color:var(--orange-tx)}
.kpi span{font-size:.86rem;color:var(--soft)}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;border-radius:var(--r);padding:14px 18px;background:var(--peach);border:1px solid #F7D8B5}
footer{max-width:1240px;margin:auto;padding:0 16px 40px;color:var(--soft);font-size:.82rem}
</style>
<link rel="stylesheet" href="assets/portal-ui.css?v=1">
</head>
<body>
<div id="demobar"></div>
<header class="top"><div class="in">
  <a class="brand" href="member-demo.html"><img src="assets/logo.png" alt=""><span>教育資料素養提升計畫<small>後台</small></span></a>
  <div class="who" id="who"></div>
</div></header>
<div class="layout">
  <nav class="side" id="side" aria-label="後台選單"></nav>
  <main id="main"></main>
</div>
<footer>操作示範：資料都是虛構的，只存在你的瀏覽器裡。和網站示範共用同一份資料，在這裡審核或結業後，切回網站就看得到結果。</footer>

<script src="assets/portal-core.js?v=1"></script>
<script>
(function () {
'use strict';
const P = window.P;
const {esc, chip, stChip, note, U, SS, C, me, has, JOB, md, ended, sessName, taken, done, entitled, active} = P;
const $ = s => document.querySelector(s);
const st = () => P.st;

function navFor(u) {
  const g = [];
  if (has(u,'lecturer')) g.push(['講師工作台',[['teach','我的授課'],['roll','點名'],['lectq','講師資格']]]);
  if (has(u,'county')) g.push(['縣市承辦',[['nominate','講師培訓推薦'],['countystat','本縣市參與']]]);
  if (has(u,'staff')) g.push(['計畫管理',[['dash','總覽'],['review','報名審核'],['invites','推薦與邀請'],['complete','結業與全教網'],['lecturers','講師管理'],['courses','課程設定'],['ents','平台權限']]]);
  return g;
}
function badgeFor(v, u) {
  const s = st(); let n = 0;
  if (v === 'review') n = s.regs.filter(r => r.status === 'pending').length;
  if (v === 'complete') n = s.sessions.filter(x => ended(x) && s.regs.some(r => r.sess === x.id && ['admitted','attended','completed'].includes(r.status))).length;
  if (v === 'lecturers') n = s.reviews.filter(r => r.status === 'submitted').length;
  if (v === 'roll') n = s.sessions.filter(x => x.lect === u.id && ended(x) && !x.roll && s.regs.some(r => r.sess === x.id && r.status === 'admitted')).length;
  return n ? '<span class="badge">' + n + '</span>' : '';
}

const V = {};
/* 講師 */
V.teach = u => {
  const list = st().sessions.filter(s => s.lect === u.id).sort((a,b) => a.date < b.date ? -1 : 1);
  let h = '<div class="phead"><h1>我的授課</h1><p>承辦指派給你的場次。</p></div>';
  h += '<div class="p-tw"><table><thead><tr><th>場次</th><th>地點</th><th>學員</th><th>狀態</th><th></th></tr></thead><tbody>';
  list.forEach(s => {
    const n = st().regs.filter(r => r.sess === s.id && ['admitted','attended','absent','completed','reported'].includes(r.status)).length;
    const stt = !ended(s) ? chip('即將開始','info') : s.roll ? chip('已點名','good') : chip('待點名','warn');
    h += '<tr><td>' + esc(sessName(s)) + '</td><td>' + esc(s.venue) + '</td><td class="num">' + n + '</td><td>' + stt + '</td><td>' + (ended(s) && !s.roll ? '<button type="button" class="btn btn-primary btn-sm" data-pa="roll" data-id="' + s.id + '">去點名</button>' : '<button type="button" class="btn btn-ghost btn-sm" data-pa="roster" data-id="' + s.id + '">學員名單</button>') + '</td></tr>';
  });
  if (!list.length) h += '<tr><td colspan="5" class="muted">目前沒有指派的場次。</td></tr>';
  h += '</tbody></table></div>';
  return h + note('講師只看得到自己場次的學員姓名與服務單位，看不到身分證字號、email 等資料。');
};
V.roll = u => {
  const s0 = st();
  const pool = s0.sessions.filter(s => ended(s) && (has(u,'staff') || s.lect === u.id) && s0.regs.some(r => r.sess === s.id && r.status === 'admitted'));
  let h = '<div class="phead"><h1>點名</h1><p>研習結束後登記每位學員是否出席，承辦會依此核發結業。</p></div>';
  if (!pool.length) return h + '<div class="card tint"><p>沒有待點名的場次。</p></div>' + note('之後可以改成學員現場掃 QR code 自行簽到，講師只要確認。');
  if (!pool.some(s => s.id === s0.rollSid)) { s0.rollSid = pool[0].id; s0.rollMarks = {}; }
  const s = SS(s0.rollSid);
  const list = s0.regs.filter(r => r.sess === s.id && r.status === 'admitted');
  h += '<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-end"><div class="fld" style="flex:1 1 260px"><label for="rollsel">場次</label><select id="rollsel" class="p-sel" data-pchg="rollsel">' + pool.map(x => '<option value="' + x.id + '"' + (x.id === s.id ? ' selected' : '') + '>' + esc(sessName(x)) + '</option>').join('') + '</select></div><button type="button" class="btn btn-line btn-sm" data-pa="rollall">全部標為出席</button></div></div>';
  h += '<div class="p-tw"><table><thead><tr><th>學員</th><th>服務單位</th><th>出席</th></tr></thead><tbody>';
  list.forEach(r => { const p = U(r.user), m = s0.rollMarks[r.id];
    h += '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.org) + '</td><td><div class="row"><button type="button" class="btn btn-sm ' + (m === 'attended' ? 'btn-primary' : 'btn-ghost') + '" data-pa="mark" data-id="' + r.id + '" data-v="attended" aria-pressed="' + (m === 'attended') + '">出席</button><button type="button" class="btn btn-sm ' + (m === 'absent' ? 'btn-danger' : 'btn-ghost') + '" data-pa="mark" data-id="' + r.id + '" data-v="absent" aria-pressed="' + (m === 'absent') + '">缺席</button></div></td></tr>'; });
  const left = list.filter(r => !s0.rollMarks[r.id]).length;
  h += '</tbody></table></div><div class="row"><button type="button" class="btn btn-primary" data-pa="rollsubmit" ' + (left ? 'disabled' : '') + '>送出點名結果</button><span class="small muted">' + (left ? '還有 ' + left + ' 位未標記' : '全部已標記') + '</span></div>';
  return h + note('之後可以改成學員現場掃 QR code 自行簽到，講師只要確認。');
};
V.lectq = u => {
  const L = u.lect, taught = st().sessions.filter(s => s.lect === u.id && ended(s));
  let h = '<div class="phead"><h1>講師資格</h1></div>';
  h += '<div class="grid3"><div class="kpi static"><span>資格效期至</span><b class="num">' + esc(L.until) + '</b><span>效期 2 年</span></div><div class="kpi static"><span>已授課</span><b>' + taught.length + ' 場</b><span>系統自動累計</span></div><div class="kpi static"><span>可授課區域</span><b>' + esc(L.regions.join('、') || '未填') + '</b><span>承辦排課時參考</span></div></div>';
  h += '<div class="card"><h2>講師檔案</h2><form class="f" data-pform="lect"><div class="fld"><span class="lb">可授課區域</span><div class="radios">' + ['北區','中區','南區','東區'].map(r => '<label><input type="checkbox" name="regions" value="' + r + '"' + (L.regions.includes(r) ? ' checked' : '') + '>' + r + '</label>').join('') + '</div></div>'
    + '<div class="fld"><label for="l-tags">專長（以頓號分隔）</label><input id="l-tags" name="tags" type="text" value="' + esc(L.tags.join('、')) + '"></div>'
    + '<div class="fld"><label for="l-bio">簡介</label><textarea id="l-bio" name="bio">' + esc(L.bio) + '</textarea></div><div class="row"><button class="btn btn-primary btn-sm" type="submit">儲存</button></div></form></div>';
  h += '<div class="card tint"><h3>授課紀錄</h3>' + (taught.length ? '<ul>' + taught.map(s => '<li>' + esc(sessName(s)) + '・' + esc(s.venue) + '</li>').join('') + '</ul>' : '<p class="muted">尚無</p>') + '</div>';
  return h + note('資格期滿時要參加回流研習，並出示期間內擔任講師的證明。授課紀錄由系統累計，就可以直接當作續證依據。');
};
/* 縣市承辦 */
V.nominate = u => {
  const mine = st().invites.filter(i => i.county === u.county && i.course === 'T');
  const used = mine.filter(i => i.status !== 'withdrawn').length;
  let h = '<div class="phead"><h1>講師培訓推薦</h1><p>' + esc(C('T').name) + '・' + esc(u.county) + '名額 <b class="num">' + used + ' / ' + P.QUOTA + '</b></p></div>';
  h += '<div class="p-tw"><table><thead><tr><th>被推薦人</th><th>服務單位</th><th>邀請狀態</th><th>報名狀態</th><th></th></tr></thead><tbody>';
  mine.forEach(i => {
    const r = i.user && st().regs.find(x => x.user === i.user && SS(x.sess).course === 'T' && active(x));
    const is = {sent:chip('已寄邀請・未回應','warn'), accepted:chip('已接受','good'), withdrawn:chip('已撤回')}[i.status];
    h += '<tr><td>' + esc(i.name) + '<div class="sub">' + esc(i.email) + '</div></td><td>' + esc(i.org) + '</td><td>' + is + '<div class="sub">寄出 ' + esc(i.sent) + '</div></td><td>' + (r ? stChip(r.status) + '<div class="sub">' + esc(SS(r.sess).region) + '場</div>' : '<span class="muted small">尚未報名</span>') + '</td><td>' + (i.status === 'sent' ? '<div class="row"><button type="button" class="btn btn-ghost btn-sm" data-pa="resend" data-id="' + i.id + '">重寄</button><button type="button" class="btn btn-danger btn-sm" data-pa="withdraw" data-id="' + i.id + '">撤回</button></div>' : '') + '</td></tr>';
  });
  if (!mine.length) h += '<tr><td colspan="5" class="muted">尚未推薦</td></tr>';
  h += '</tbody></table></div>';
  if (used < P.QUOTA) h += '<div class="card"><h2>新增推薦</h2><form class="f" data-pform="nominate"><div class="fgrid"><div class="fld"><label for="n-name">姓名</label><input id="n-name" name="name" type="text" required></div><div class="fld"><label for="n-email">Email</label><input id="n-email" name="email" type="email" required placeholder="建議填常用信箱"></div><div class="fld"><label for="n-org">服務單位</label><input id="n-org" name="org" type="text" required></div></div><div class="row"><button class="btn btn-primary btn-sm" type="submit">推薦並寄出邀請</button><span class="small muted">被推薦人會收到邀請信，點連結就能報名。</span></div></form></div>';
  else h += '<div class="card tint"><p>名額已用完。撤回未回應的推薦可以釋出名額。</p></div>';
  return h + note('縣市直接在平台推薦，取代交 Excel 表格。被推薦人點邀請信就能報名，就算 email 跟帳號不同也能綁定；承辦也看得到誰還沒回應。');
};
V.countystat = u => {
  const ppl = st().users.filter(x => x.county === u.county && has(x,'learner'));
  let h = '<div class="phead"><h1>本縣市參與</h1><p>' + esc(u.county) + '教師與行政人員的研習進度。</p></div><div class="grid3">';
  st().courses.forEach(c => { const reg = ppl.filter(p => st().regs.some(r => r.user === p.id && active(r) && SS(r.sess).course === c.id)).length, dn = ppl.filter(p => done(p.id, c.id)).length;
    h += '<div class="kpi static"><span>' + esc(c.level) + '・' + esc(c.name) + '</span><b class="num">' + dn + '</b><span>已結業（報名 ' + reg + ' 人）</span></div>'; });
  h += '</div><div class="p-tw"><table><thead><tr><th>姓名</th><th>服務單位</th><th>職務</th><th>初階</th><th>進階</th><th>分析平台</th></tr></thead><tbody>';
  ppl.forEach(p => { h += '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.org) + '</td><td>' + esc(JOB[p.job]) + '</td><td>' + (done(p.id,'A') ? chip('結業','good') : '—') + '</td><td>' + (done(p.id,'B') ? chip('結業','good') : '—') + '</td><td>' + (entitled(p.id) ? chip('已開通','teal') : '—') + '</td></tr>'; });
  h += '</tbody></table></div>';
  return h + note('縣市只看得到自己縣市的人。要列出姓名，還是只給統計數字，需要再討論。');
};
/* 計畫承辦 */
V.dash = () => {
  const s = st();
  const pend = s.regs.filter(r => r.status === 'pending').length;
  const roll = s.sessions.filter(x => ended(x) && !x.roll && s.regs.some(r => r.sess === x.id && r.status === 'admitted')).length;
  const att = s.regs.filter(r => r.status === 'attended').length;
  const comp = s.regs.filter(r => r.status === 'completed').length;
  const rev = s.reviews.filter(r => r.status === 'submitted').length;
  const inv = s.invites.filter(i => i.status === 'sent').length;
  const k = (n,t,sub,v) => '<button type="button" class="kpi' + (n ? ' hot' : '') + '" data-pa="go" data-v="' + v + '"><span>' + t + '</span><b>' + n + '</b><span>' + sub + '</span></button>';
  let h = '<div class="phead"><h1>總覽</h1><p>今天是 ' + md(P.TODAY) + '。數字是待處理的件數，點進去處理。</p></div><div class="grid3">'
    + k(pend,'待審核報名','含先修證明檢視','review') + k(roll,'待點名場次','等講師點名，或由承辦代點','complete')
    + k(att,'待核發結業','已出席、尚未結業的人數','complete') + k(comp,'待登錄全教網','已結業、尚未登錄的人數','complete')
    + k(rev,'待審講師認證','公版簡報與試教影片','lecturers') + k(inv,'推薦邀請未回應','可提醒縣市或重寄','invites') + '</div>';
  const nol = s.sessions.filter(x => !ended(x) && !x.lect);
  if (nol.length) h += '<div class="banner"><span>有 ' + nol.length + ' 個場次還沒指派講師。</span><button type="button" class="btn btn-line btn-sm" data-pa="go" data-v="lecturers">去指派</button></div>';
  h += '<div class="card"><h2>近期場次</h2><div class="p-tw" style="margin-top:12px"><table><thead><tr><th>場次</th><th>地點</th><th>錄取／名額</th><th>待審</th><th>講師</th></tr></thead><tbody>';
  s.sessions.filter(x => !ended(x)).sort((a,b) => a.date < b.date ? -1 : 1).forEach(x => { h += '<tr><td>' + esc(sessName(x)) + '</td><td>' + esc(x.venue) + '</td><td class="num">' + taken(x) + ' / ' + x.cap + '</td><td class="num">' + s.regs.filter(r => r.sess === x.id && r.status === 'pending').length + '</td><td>' + (x.lect ? esc(U(x.lect).name) : chip('未指派','warn')) + '</td></tr>'; });
  return h + '</tbody></table></div></div>';
};
V.review = () => {
  const s0 = st(), f = s0.reviewFilter;
  const list = s0.regs.filter(r => f === 'pending' ? r.status === 'pending' : (r.sess === f && active(r)));
  let h = '<div class="phead"><h1>報名審核</h1><p>檢查資格與先修證明後，決定錄取、備取或不錄取。</p></div>';

    const sel = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); P.toast('已選取文字，請按 Ctrl+C 複製'); };
    try { navigator.clipboard.writeText(t).then(() => P.toast('已複製 CSV'), sel); } catch (e) { sel(); } },
  reported: d => { let n = 0; st().regs.filter(r => r.sess === d.id && r.status === 'completed').forEach(r => { r.status = 'reported'; n++; }); P.closeModal(); P.render(); P.toast(n + ' 人已標記為登錄全教網'); },
  lectok: d => { const s0 = st(), r = s0.reviews.find(x => x.id === d.id), u = U(r.user); r.status = 'approved'; if (!has(u,'lecturer')) u.roles.push('lecturer');
    u.lect = {until:P.addYears(P.TODAY, 2), regions:[], tags:[], bio:''};
    if (!entitled(u.id)) s0.ents.push({user:u.id, src:'具講師資格', date:P.TODAY}); P.render(); P.toast(u.name + ' 已取得講師資格（效期至 ' + u.lect.until + '）'); },
  lectback: d => { const r = st().reviews.find(x => x.id === d.id), u = U(r.user); r.status = 'returned';
    P.addMail(st(), u.email, '【教育資料素養提升計畫】講師認證資料請補件', u.name + ' 您好：\n您的試教影片需要補充說明，請登入網站重新上傳。'); P.render(); P.toast('已退回補件，並寄信通知 ' + u.name); },
  toggleopen: d => { const s = SS(d.id); s.open = !s.open; P.render(); P.toast(s.open ? '已開放報名' : '已關閉報名'); },
  revoke: d => { const p = U(d.id); st().ents = st().ents.filter(e => e.user !== d.id); P.render(); P.toast('已停用 ' + p.name + ' 的分析平台權限'); }
});
Object.assign(P.CHG, {
  rollsel: v => { st().rollSid = v; st().rollMarks = {}; P.render(); },
  rfilter: v => { st().reviewFilter = v; P.render(); },
  assign: (v, el) => { SS(el.dataset.id).lect = v || null; P.render(); P.toast(v ? '已指派 ' + U(v).name : '已取消指派'); },
  elig: (v, el) => { C(el.dataset.id).elig = v; P.render(); P.toast('已改為「' + P.ELIG[v][0] + '」'); }
});
Object.assign(P.FORM, {
  lect: fd => { const u = me(); u.lect.regions = fd.getAll('regions'); u.lect.tags = fd.get('tags').split(/[、,，]/).map(s => s.trim()).filter(Boolean); u.lect.bio = fd.get('bio'); P.render(); P.toast('講師檔案已更新'); },
  nominate: fd => { const u = me(), i = {id:'i' + Date.now(), course:'T', county:u.county, name:fd.get('name').trim(), email:fd.get('email').trim().toLowerCase(), org:fd.get('org').trim(), status:'sent', user:null, by:u.id, sent:P.TODAY};
    const ex = st().users.find(x => x.email === i.email); st().invites.push(i); P.inviteMail(st(), i); P.render(); P.toast('已推薦 ' + i.name + '，邀請信已寄出' + (ex ? '（此 email 已有帳號，登入後即可接受）' : '')); },
  import: fd => { let n = 0; fd.get('rows').split('\n').map(l => l.trim()).filter(Boolean).forEach(l => { const [name, email, county, org] = l.split(/[,，]/).map(x => (x || '').trim()); if (!name || !email) return;
    const i = {id:'i' + Date.now() + n, course:'T', county:county || '未填', name, email:email.toLowerCase(), org:org || '', status:'sent', user:null, by:null, sent:P.TODAY}; st().invites.push(i); P.inviteMail(st(), i); n++; }); P.render(); P.toast('已匯入 ' + n + ' 位，邀請信已寄出'); },
  grant: fd => { const id = fd.get('user'); if (!id) return; st().ents.push({user:id, src:fd.get('src').trim(), date:P.TODAY}); P.render(); P.toast('已開通 ' + U(id).name + ' 的分析平台'); }
});

// 從網站選單點進來時（admin-demo.html#roll 這類），直接打開對應的畫面
const want = location.hash.slice(1);
if (want) st().view = want;
P.render();
})();
</script>

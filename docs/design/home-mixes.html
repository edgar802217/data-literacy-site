<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>首頁三種組合</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=LXGW+WenKai+TC:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
</head>
<body>
<style>
/* 首頁三種「不用方塊」的組合：
   I 路線圖 × 海報（大色面、直排標題、網點地圖、捷運路線圖與時刻表）
   II 資料故事 × 路線圖（捲動時 LOGO 折線長成學習路線）
   III 筆記本 × 路線圖（方格紙、手繪路線、便利貼、紅筆與螢光筆）
   都沿用 LOGO 四色；研習＝藍、分析平台＝橘、講師培訓＝青綠。 */
:root{
  color-scheme:light;
  --tool:#17222B; --tool-2:#26343F; --tool-tx:#E9EEF2; --canvas:#DDE3E8;
  --ink:#16222C; --ink-2:#3A4853; --soft:#63707B;
  --blue:#1B5FA6; --sky:#2185B5; --teal:#1E97A3; --orange:#EE7A1D; --orange-d:#B4560C;
  --f-head:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--canvas)}
body{margin:0;color:var(--ink);font:16px/1.7 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #4C8BD6;outline-offset:3px;border-radius:6px}

/* 工具列與外框 */
.tool{position:sticky;top:0;z-index:60;background:var(--tool);color:var(--tool-tx);height:56px}
.tool .in{display:flex;align-items:center;gap:10px 18px;padding:0 16px;height:56px;max-width:1600px;margin:auto;overflow-x:auto}
.tool h1{font:800 1rem/1.2 var(--f-head);margin:0;white-space:nowrap}
.seg{display:inline-flex;background:var(--tool-2);border-radius:9px;padding:3px;gap:2px;flex:none}
.seg button{background:none;border:0;color:#C4D0DA;padding:6px 11px;border-radius:7px;cursor:pointer;font-size:.86rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:700}
.tool .lb{font-size:.75rem;color:#9FB0BF;letter-spacing:.06em;white-space:nowrap}
.tool .sp{flex:1}
.tbtn{background:none;border:1px solid #4A5A68;color:var(--tool-tx);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:.86rem;white-space:nowrap;flex:none}
.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;max-width:1600px;margin:auto;padding:24px 16px 64px;align-items:start}
.work.nonotes{grid-template-columns:minmax(0,1fr)}
@media (max-width:1100px){.work{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;justify-content:center;min-width:0}
.browser{width:100%;max-width:1240px;border-radius:14px;box-shadow:0 30px 60px -36px rgba(23,34,43,.6);background:#fff}
.browser.phone{max-width:390px;border-radius:32px;border:9px solid #17222B}
.chrome{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;background:#EEF2F5;border-bottom:1px solid #DDE4EA;font-size:.74rem;color:#8C98A3;border-radius:14px 14px 0 0}
.phone .chrome{justify-content:center;border-radius:22px 22px 0 0}
.chrome i{width:9px;height:9px;border-radius:50%;background:#D4DBE1}
.phone .chrome i{display:none}
.frame{container-type:inline-size;position:relative;overflow-x:clip;border-radius:0 0 14px 14px}
.phone .frame{border-radius:0 0 22px 22px}
.notes{position:sticky;top:76px;background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 0 #D4DBE1;font-size:.9rem;line-height:1.65}
.notes h2{font:800 1.1rem/1.3 var(--f-head);margin:0}
.notes .tag{display:inline-block;font:700 .72rem/1 var(--f-body);color:#fff;background:var(--ink);padding:4px 8px;border-radius:5px;margin-bottom:8px}
.notes h3{font-size:.8rem;letter-spacing:.06em;color:var(--soft);margin:14px 0 4px}
.notes ul{margin:0;padding-left:1.1em}
.notes li+li{margin-top:4px}
.notes .tip{margin-top:14px;padding:10px 12px;background:#F3F6F8;border-radius:10px}
@media (max-width:1100px){.notes{position:static}}

.pg{position:relative}
.pg h1,.pg h2,.pg h3{margin:0;line-height:1.15;text-wrap:balance}
.pg p{margin:0}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:absolute;left:50%;top:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:.9rem;z-index:40;max-width:calc(100% - 32px)}
.only-phone{display:none}
@container (max-width:760px){.only-desk{display:none}.only-phone{display:block}}
@keyframes draw{from{stroke-dashoffset:var(--len,2000)}}
@keyframes popin{from{opacity:0;transform:scale(.4)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes flap{0%{transform:rotateX(-90deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes swipe{from{background-size:0 100%}}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* =========================================================
   I 路線圖 × 海報
   ========================================================= */
.mI{background:#F3F5F6;color:var(--ink);
  background-image:radial-gradient(rgba(22,34,44,.07) 1px,transparent 1.2px);background-size:7px 7px}
.mI .bar{display:flex;align-items:center;gap:18px;padding:18px 36px}
.mI .bar .mark{display:flex;align-items:center;gap:10px;font:800 1rem var(--f-head)}
.mI .bar nav{margin-left:auto;display:flex;gap:22px;font-weight:700;font-size:.95rem}
.mI .bar nav button{background:none;border:0;padding:0;cursor:pointer}
.mI .bar nav button.line{display:inline-flex;align-items:center;gap:8px}
.mI .bar nav button.line i{width:22px;height:6px;border-radius:3px;background:var(--c)}
.mI .login{border:2px solid var(--ink);border-radius:999px;padding:6px 16px;background:none;font-weight:800;cursor:pointer}
.mI .poster{position:relative;display:grid;grid-template-columns:96px 1fr;gap:0;padding:8px 36px 0}
.mI .vt{writing-mode:vertical-rl;font:800 2.4rem/1 var(--f-head);color:var(--blue);letter-spacing:.12em;border-right:6px solid var(--blue);padding-right:14px;align-self:start;height:max-content}
.mI .vt small{display:block;font:700 .9rem var(--f-body);letter-spacing:.3em;color:var(--soft);margin-top:14px}
.mI .head{padding-left:28px}
.mI .head h1{font:900 clamp(2.8rem,1.2rem + 5.4cqw,6rem)/1 var(--f-body);letter-spacing:-.02em}
.mI .head h1 em{font-style:normal;color:var(--orange)}
.mI .head p{font-size:1.15rem;color:var(--ink-2);margin-top:14px;max-width:30em}
.mI .tw{position:absolute;right:20px;top:-10px;width:330px;opacity:.9;pointer-events:none}
.mI .tw path{fill:url(#dots);stroke:none}
.mI .mapwrap{padding:14px 36px 8px 36px;position:relative}
.mI svg.metro{width:100%;height:auto;display:block;overflow:visible}
.mI .metro .ln{fill:none;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);animation:draw 1.6s cubic-bezier(.6,0,.3,1) both}
.mI .metro .st{cursor:pointer}
.mI .metro .st circle{fill:#fff;stroke-width:6;transition:r .25s}
.mI .metro .st:hover circle,.mI .metro .st.on circle{r:19}
.mI .metro .st text{font:800 22px var(--f-head);fill:var(--ink)}
.mI .metro .st text.en{font:600 12px var(--f-mono);fill:var(--soft);letter-spacing:.08em}
.mI .metro .xg rect{fill:#fff;stroke:var(--ink);stroke-width:6}
.mI .metro .st{animation:popin .4s cubic-bezier(.3,1.6,.5,1) both}
.mI .metro .legend text{font:700 14px var(--f-body);fill:var(--ink-2)}
.mI .metro .you{animation:blink 1.4s steps(2) infinite}
.mI .sign{margin:6px 36px 0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;background:var(--ink);color:#fff;padding:16px 22px;border-left:14px solid var(--c);animation:rise .4s both}
.mI .sign .n{font:800 2rem var(--f-head)}
.mI .sign .n small{display:block;font:600 .72rem var(--f-mono);letter-spacing:.12em;color:#9FB0BF}
.mI .sign p{color:#D6DEE5}
.mI .sign button{background:var(--c);color:#fff;border:0;border-radius:999px;padding:12px 22px;font-weight:800;cursor:pointer;white-space:nowrap}
.mI .board{margin-top:44px;background:var(--blue);color:#fff;padding:40px 36px 46px;clip-path:polygon(0 36px,100% 0,100% 100%,0 100%)}
.mI .board h2{font:900 clamp(2rem,1.2rem + 2.6cqw,3.2rem)/1.1 var(--f-body);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:24px}
.mI .board h2 small{font:600 .9rem var(--f-mono);letter-spacing:.14em;color:#BFD6EE}
.mI .tt{margin-top:22px;background:#0F1A22;border-radius:6px;padding:8px 0;font-size:.98rem}
.mI .tt .r{display:grid;grid-template-columns:110px 1.4fr 90px 1.2fr 120px;gap:12px;align-items:center;padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.08);animation:flap .5s both;transform-origin:top;cursor:pointer}
.mI .tt .r:hover{background:rgba(255,255,255,.05)}
.mI .tt .r:last-child{border-bottom:0}
.mI .tt .h{color:#7F95A6;font:600 .72rem var(--f-mono);letter-spacing:.12em;cursor:default;animation:none}
.mI .tt .h:hover{background:none}
.mI .tt .d{font:600 1.15rem var(--f-mono);color:#FFB21E}
.mI .tt .c{display:flex;align-items:center;gap:8px;font-weight:700}
.mI .tt .c i{width:8px;height:22px;border-radius:2px;background:var(--lc)}
.mI .tt .p{font:600 .95rem var(--f-mono);color:#fff;background:rgba(255,255,255,.1);border-radius:4px;padding:2px 8px;justify-self:start}
.mI .tt .s{font-weight:800;justify-self:end}
.mI .tt .s.ok{color:#7CE0A3}.mI .tt .s.no{color:#9FB0BF}
.mI .tt .v{color:#B9C6D0;font-size:.9rem}
@container (max-width:760px){
  .mI .bar{padding:14px 18px}.mI .bar nav{display:none}.mI .login{margin-left:auto}
  .mI .poster{grid-template-columns:56px 1fr;padding:4px 18px 0}
  .mI .vt{font-size:1.5rem;padding-right:8px;border-right-width:4px}
  .mI .head{padding-left:14px}
  .mI .head p{font-size:1rem}
  .mI .tw{width:150px;right:0;top:120px;opacity:.6}
  .mI .mapwrap{padding:14px 12px 0}
  .mI .sign{margin:6px 14px 0;grid-template-columns:1fr;gap:8px}
  .mI .board{padding:36px 14px 36px}
  .mI .tt .r{grid-template-columns:70px 1fr auto;gap:8px;padding:10px 12px}
  .mI .tt .v,.mI .tt .p{display:none}
  .mI .tt .h{display:none}
}

/* =========================================================
   II 資料故事 × 路線圖
   ========================================================= */
.mII{background:#FAFBFC;color:var(--ink)}
.mII .quick{position:sticky;top:56px;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 32px;background:rgba(250,251,252,.92);backdrop-filter:blur(8px);border-bottom:1px solid #E3E8EC;font-size:.92rem}
.mII .quick .mark{display:flex;align-items:center;gap:8px;font:800 .95rem var(--f-head);margin-right:auto}
.mII .quick span{color:var(--soft)}
.mII .quick button{border:0;border-radius:999px;padding:7px 14px;font-weight:800;cursor:pointer;color:#fff;background:var(--c)}
.mII .open{min-height:560px;display:flex;flex-direction:column;justify-content:center;padding:40px 32px 60px;position:relative}
.mII .open h1{font:900 clamp(2.8rem,1.2rem + 5.6cqw,6.2rem)/1.04 var(--f-body);letter-spacing:-.02em;max-width:9em}
.mII .open h1 span{background:linear-gradient(transparent 70%,#FFD2A8 70%)}
.mII .open p{font-size:1.15rem;color:var(--ink-2);margin-top:18px;max-width:28em}
.mII .scrollcue{margin-top:40px;display:flex;align-items:center;gap:12px;font-weight:700;color:var(--soft)}
.mII .scrollcue i{width:2px;height:54px;background:linear-gradient(var(--ink),transparent);animation:cue 1.6s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(.2);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(.2);transform-origin:bottom}}
.mII .story{position:relative;height:2600px}
.mII .stick{position:sticky;top:110px;height:560px;display:grid;grid-template-columns:.9fr 1.4fr;gap:24px;align-items:center;padding:0 32px}
.mII .caps{position:relative;height:300px}
.mII .cap{position:absolute;inset:0;opacity:0;transform:translateY(20px);transition:opacity .5s,transform .5s;display:flex;flex-direction:column;justify-content:center}
.mII .cap.on{opacity:1;transform:none}
.mII .cap .k{font:600 .8rem var(--f-mono);letter-spacing:.14em;color:var(--c)}
.mII .cap h2{font:900 clamp(1.8rem,1rem + 2.6cqw,3rem)/1.15 var(--f-body);margin-top:8px}
.mII .cap p{font-size:1.08rem;color:var(--ink-2);margin-top:10px;max-width:22em}
.mII .cap .big{font:800 clamp(4rem,2rem + 6cqw,7rem)/1 var(--f-head);color:var(--blue)}
.mII svg.chart{width:100%;height:auto;overflow:visible}
.mII .chart .base{stroke:#D5DDE3;stroke-width:3}
.mII .chart .b{transform-box:fill-box;transform-origin:bottom;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.mII .chart .path{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.mII .chart .node{transition:r .4s cubic-bezier(.3,1.6,.5,1)}
.mII .chart .lbl{font:800 20px var(--f-head);fill:var(--ink);opacity:0;transition:opacity .4s}
.mII .chart .lbl.on{opacity:1}
.mII .chart .tline{stroke:var(--teal);stroke-width:6;stroke-dasharray:2 12;stroke-linecap:round;fill:none;opacity:0;transition:opacity .5s}
.mII .chart .tline.on{opacity:1}
.mII .fork{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.mII .fork button{border:0;border-radius:999px;padding:14px 24px;font:800 1.05rem var(--f-head);cursor:pointer;color:#fff;background:var(--c);display:inline-flex;gap:10px;align-items:center}
.mII .prog{position:absolute;left:32px;right:32px;bottom:0;height:4px;background:#E6EBEF;border-radius:2px}
.mII .prog i{display:block;height:100%;width:0;background:var(--ink);border-radius:2px}
.mII .after{padding:40px 32px 70px;display:grid;grid-template-columns:repeat(3,1fr);gap:32px;border-top:1px solid #E3E8EC}
.mII .after h3{font:800 1.1rem var(--f-head)}
.mII .after p{color:var(--soft);margin-top:4px}
.mII .after .d{font:800 3rem/1 var(--f-head);color:var(--c)}
@container (max-width:760px){
  .mII .quick{padding:8px 14px}.mII .quick span{display:none}
  .mII .quick .mark b{display:none}
  .mII .open{padding:28px 18px 40px;min-height:480px}
  .mII .stick{grid-template-columns:1fr;grid-template-rows:auto auto;top:104px;height:auto;padding:0 18px;gap:8px}
  .mII .caps{height:220px;order:2}
  .mII .story{height:2400px}
  .mII .after{grid-template-columns:1fr;padding:32px 18px 60px}
}

/* =========================================================
   III 筆記本 × 路線圖
   ========================================================= */
.mIII{--grid:#D7E6F2;background:#FDFEFE;color:#22303A;
  background-image:linear-gradient(90deg,transparent 70px,#F2A7A7 70px,#F2A7A7 72px,transparent 72px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% 100%,26px 26px,26px 26px;font-family:var(--f-body)}
.mIII .hand{font-family:var(--f-hand)}
.mIII .bar{display:flex;align-items:center;gap:16px;padding:16px 32px 16px 96px}
.mIII .bar .mark{display:flex;align-items:center;gap:10px;font:700 1.15rem var(--f-hand)}
.mIII .bar nav{margin-left:auto;display:flex;gap:20px}
.mIII .bar nav button{background:none;border:0;padding:0 2px;cursor:pointer;font:700 1.08rem var(--f-hand);background-image:linear-gradient(#FFE16B,#FFE16B);background-size:0 40%;background-position:0 85%;background-repeat:no-repeat;transition:background-size .3s}
.mIII .bar nav button:hover{background-size:100% 40%}
.mIII .login{border:2px solid #22303A;border-radius:10px 14px 9px 13px;padding:4px 14px;background:#fff;font:700 1rem var(--f-hand);cursor:pointer}
.mIII .page{padding:10px 32px 0 96px;position:relative}
.mIII .date{font:600 .85rem var(--f-mono);color:#8A97A2}
.mIII h1{font:700 clamp(2.4rem,1.2rem + 4.6cqw,5.2rem)/1.15 var(--f-hand);margin-top:6px}
.mIII .hl{background-image:linear-gradient(104deg,rgba(255,225,107,0) 1%,rgba(255,225,107,.95) 3%,rgba(255,215,80,.9) 96%,rgba(255,225,107,0));background-size:100% 46%;background-position:0 88%;background-repeat:no-repeat;animation:swipe .9s .4s cubic-bezier(.6,0,.3,1) both}
.mIII .lead{font-size:1.12rem;color:#46545F;margin-top:12px;max-width:30em}
.mIII .route{position:relative;margin-top:16px}
.mIII svg.rt{width:100%;height:auto;overflow:visible;display:block}
.mIII .rt .pen{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);animation:draw 1.8s .3s cubic-bezier(.6,0,.3,1) both}
.mIII .rt .stp{cursor:pointer}
.mIII .rt .stp path.o{fill:#fff;stroke-width:4.5}
.mIII .rt .stp:hover path.o{fill:#FFF6C9}
.mIII .rt text{font:700 24px var(--f-hand);fill:#22303A}
.mIII .rt text.s{font:400 16px var(--f-hand);fill:#5E6B75}
.mIII .rt .note{font:700 19px var(--f-hand);fill:#C8352B}
.mIII .sticky{position:absolute;width:230px;padding:20px 18px 18px;background:#FFE88F;box-shadow:0 14px 20px -14px rgba(0,0,0,.45),0 2px 0 rgba(0,0,0,.04);transform:rotate(-3deg);font-family:var(--f-hand);animation:rise .5s .9s both;cursor:pointer}
.mIII .sticky::before{content:"";position:absolute;left:50%;top:-12px;width:90px;height:24px;margin-left:-45px;background:rgba(210,225,235,.75);transform:rotate(2deg)}
.mIII .sticky b{display:block;font-size:1.05rem;color:#7A5A00}
.mIII .sticky .big{font-size:1.9rem;line-height:1.1;position:relative;display:inline-block;margin:6px 0}
.mIII .sticky .big svg{position:absolute;left:-12px;top:-10px;width:calc(100% + 24px);height:calc(100% + 20px);overflow:visible}
.mIII .sticky .big svg path{fill:none;stroke:#D9372B;stroke-width:3;stroke-linecap:round;stroke-dasharray:420;animation:draw 1s 1.5s ease-out both;--len:420}
.mIII .sticky p{font-size:1.02rem;line-height:1.5}
.mIII .choose{display:flex;flex-wrap:wrap;gap:20px 56px;margin-top:6px;padding-bottom:10px}
.mIII .choose button{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-family:var(--f-hand);position:relative}
.mIII .choose b{font-size:2rem;display:inline-flex;align-items:center;gap:10px}
.mIII .choose span{display:block;font-size:1.05rem;color:#5E6B75}
.mIII .choose svg.ul{position:absolute;left:0;bottom:30px;width:100%;height:16px;overflow:visible}
.mIII .choose svg.ul path{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;transition:stroke-dashoffset .5s}
.mIII .choose button:hover svg.ul path,.mIII .choose button:focus-visible svg.ul path{stroke-dashoffset:0}
.mIII .lower{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;padding:34px 32px 64px 96px}
.mIII .lower h2{font:700 1.7rem var(--f-hand);display:flex;align-items:center;gap:10px}
.mIII .todo{list-style:none;margin:12px 0 0;padding:0}
.mIII .todo li{display:grid;grid-template-columns:30px 82px 1fr;gap:10px;align-items:baseline;padding:6px 0;font-size:1.02rem;line-height:26px;cursor:pointer}
.mIII .todo .box{width:22px;height:22px;border:2.5px solid #22303A;border-radius:4px 6px 5px 3px;position:relative;top:4px}

function storyTick(){

  const pth=$('pth'); if(pth){const len=pth.getTotalLength(); const lp=Math.max(0,Math.min(1,(p-.18)/(.62))); pth.style.strokeDasharray=len; pth.style.strokeDashoffset=len*(1-lp); pth.setAttribute('stroke', p>.6?'#EE7A1D':'#1B5FA6');}
  const th=[.02,.25,.45,.66];
  th.forEach((t,i)=>{const n=$('n'+i); if(n) n.setAttribute('r', p>t?16:0); const l=$('l'+i); if(l) l.classList.toggle('on',p>t)});
  $('tl')&&$('tl').classList.toggle('on',p>.85); $('tll')&&$('tll').classList.toggle('on',p>.85);
}

  const t=ev.target.closest('[data-tool]');
  if(t){if(t.dataset.tool==='m'){S.m=t.dataset.v;window.scrollTo({top:0})}else S.vp=t.dataset.v;render();return}
  const a=ev.target.closest('[data-a]');
  if(a&&ACT[a.dataset.a]){ev.preventDefault();ACT[a.dataset.a](a.dataset,a)}
});
document.addEventListener('keydown',ev=>{const g=ev.target.closest&&ev.target.closest('g[data-a]');if(g&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();ACT[g.dataset.a](g.dataset,g)}});
$('t-notes').addEventListener('click',()=>{S.notes=!S.notes;render()});
$('t-replay').addEventListener('click',()=>{$('frame').innerHTML='';requestAnimationFrame(render);window.scrollTo({top:0})});
render();
</script>
</body>
</html>
